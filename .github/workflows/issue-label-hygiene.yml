name: Issue label hygiene

# #3678, from the 30-day agent-workflow retrospective. Two label states that
# nothing maintained, both measured over that window:
#
#   * 561 of 872 issues closed in the window still carried `status: in-progress`
#     and 645 an `agent:` label, so every label query had to filter on state
#     first or drown in closed issues (finding b-8);
#   * 5 of the 8 open in-progress issues sat behind a MERGED "Part of #N" pull
#     request that nobody relabelled, so the work was neither in progress nor
#     on the ready queue -- invisible to the next agent (findings b-8, b-20).
#
# Both were manual steps in the orchestrator's merge pass. A step that has to
# be remembered on every merge is one that gets skipped, and the numbers above
# are what skipping it looks like after a month.
#
# Deliberately NOT here: closing issues, commenting, and any judgement about
# what remains to be done. Those stay in the merge pass, where an agent that
# read the diff can say what actually landed.

on:
  # `closed` only. `reopened` is a separate event type, so an issue coming back
  # cannot trigger this and cannot lose the labels its next claimant sets.
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  strip-labels-on-close:
    name: Strip status and agent labels from a closed issue
    # Two independent guards on "never touches an open issue": the trigger type,
    # and the payload's own state at the moment the job runs.
    if: >-
      github.event_name == 'issues'
      && github.event.issue.state == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Remove every status: and agent: label the issue carries"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          # The labels come from the event payload, so the job removes exactly
          # what is there and nothing else. That is what makes it idempotent: a
          # second run finds none of them and edits nothing.
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail
          mapfile -t doomed < <(
            printf '%s' "$LABELS" |
              jq -r '.[] | select(startswith("status:") or startswith("agent:"))'
          )
          if [ ${#doomed[@]} -eq 0 ]; then
            echo "Issue #$ISSUE carries no status: or agent: label -- nothing to do."
            exit 0
          fi
          args=()
          for label in "${doomed[@]}"; do
            args+=(--remove-label "$label")
          done
          printf 'Removing from #%s:' "$ISSUE"
          printf ' [%s]' "${doomed[@]}"
          printf '\n'
          gh issue edit "$ISSUE" "${args[@]}"

  release-part-of-issues:
    name: Put a merged PR's Part of issue back on the ready queue
    # A fork PR's token is read-only, so the job would fail on the first label
    # edit rather than do anything useful; the branch convention it reads is
    # in-repo anyway.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The default branch, NOT the pull request's own merge ref: this job
          # holds a write token, and checking out the head of the pull request
          # that just merged would run whatever version of the extractor that
          # branch happened to ship.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Relabel the branch's own issue when the PR only landed part of it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail

          # #3930. Every exit from this job prints one `label-hygiene decision:`
          # line carrying the values that drove it. Two "Part of" merges 36
          # minutes apart, one correct and one not, produced logs that could not
          # be told apart -- the only evaluated line either printed was
          # "Releasing #N", which both printed -- so pinning the cause took two
          # sightings and a timeline read. The line is the falsifiable record.
          branch_issue=none; declared=0; state=unread; foreign_label=none; edit_rc=na
          decide() {
            printf 'label-hygiene decision: %s pr=%s head=%s branch_issue=%s declared=%s state=%s foreign=%s edit_rc=%s\n' \
              "$1" "$PR_NUMBER" "$PR_HEAD_REF" "$branch_issue" "$declared" \
              "$state" "$foreign_label" "$edit_rc"
          }

          # Narrowed to the issue the BRANCH names -- the pairing pr-gate.yml
          # refuses to merge without. A "Part of #N" naming some OTHER issue is
          # usually the tracking issue each stage of an epic cites, and putting
          # an epic on the ready queue invites an agent to claim the epic
          # itself. Those stay with the merge pass, which can read what landed.
          resolved=$(printf '%s' "$PR_HEAD_REF" | grep -oP '^agent/[^/]+/issue-\K[0-9]+(?![0-9A-Za-z])' || true)
          if [ -z "$resolved" ]; then
            echo "Head branch '$PR_HEAD_REF' names no issue -- nothing to do."
            decide no-issue-in-branch
            exit 0
          fi
          branch_issue="$resolved"

          while IFS= read -r n; do
            if [ "$n" = "$branch_issue" ]; then
              declared=1
            else
              echo "#$n is declared 'Part of' but is not the branch's own issue -- left to the merge pass."
            fi
          done < <(bash .github/scripts/part_of_references.sh)

          if [ "$declared" -eq 0 ]; then
            echo "PR #$PR_NUMBER declares no 'Part of #$branch_issue' line -- nothing to do."
            decide no-part-of-declaration
            exit 0
          fi

          meta=$(gh issue view "$branch_issue" --json state,labels 2>/dev/null) || {
            state=unreadable
            echo "#$branch_issue is not a readable issue in this repository -- nothing to do."
            decide issue-unreadable
            exit 0
          }
          state=$(printf '%s' "$meta" | jq -r '.state')
          if [ "$state" != "OPEN" ]; then
            echo "#$branch_issue is $state -- the close path already cleared its labels."
            decide issue-not-open
            exit 0
          fi

          # The PR's own agent: labels. An issue whose agent: labels are all in
          # this set was claimed by the loop that opened this PR, so releasing it
          # releases this PR's own claim. Any OTHER agent: label means a second
          # loop is on that issue, and preservation comes first: the issue is
          # left exactly as it is and the merge pass decides.
          mine=$(printf '%s' "$PR_LABELS" | jq -r '.[] | select(startswith("agent:"))')
          foreign=$(printf '%s' "$meta" | jq -r --arg mine "$mine" '
            ($mine | split("\n") | map(select(length > 0))) as $m
            | .labels[].name
            | select(startswith("agent:"))
            | select(. as $l | $m | index($l) | not)')
          if [ -n "$foreign" ]; then
            foreign_label=$(printf '%s' "$foreign" | tr '\n' ',' | sed 's/,$//')
            echo "#$branch_issue carries an agent: label this PR does not -- left untouched for the merge pass."
            decide foreign-agent-label
            exit 0
          fi

          # `status: ready` is EXCLUDED here because the edit below ADDS it,
          # and naming one label in both lists of a single `gh issue edit` is a
          # race: gh dispatches addLabels and removeLabels as two concurrent
          # GraphQL mutations (cli/cli v2.98.0,
          # pkg/cmd/pr/shared/editable_http.go). #3930 is the instance -- remove
          # won on #1883 and the job reported success having removed the label
          # it meant to add.
          #
          # Trap: re-widening this filter to "every status: label" reintroduces
          # that race for any issue carrying `status: ready` at merge time,
          # which #3960 says a claim can still produce.
          args=()
          while IFS= read -r label; do
            [ -n "$label" ] && args+=(--remove-label "$label")
          done < <(
            printf '%s' "$meta" |
              jq -r '.labels[].name
                     | select(startswith("status:") or startswith("agent:"))
                     | select(. != "status: ready")'
          )
          echo "Releasing #$branch_issue: PR #$PR_NUMBER merged and declared 'Part of #$branch_issue'."
          gh issue edit "$branch_issue" "${args[@]}" --add-label "status: ready"
          edit_rc=$?
          if [ "$edit_rc" -ne 0 ]; then
            # An edit that failed and reported success is the defect #3930 was
            # filed for. `set -e` is deliberately not used: every early exit
            # above is a legitimate 0, and this is the one failure the step has.
            echo "gh issue edit failed for #$branch_issue (exit $edit_rc) -- #$branch_issue was NOT relabelled."
            decide edit-failed
            exit 1
          fi
          decide released
