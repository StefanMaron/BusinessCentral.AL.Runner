name: PR Check

# ADVISORY checks. Nothing in this file gates a merge, and that is now a
# deliberate statement rather than an accident: the guards that must block live
# in pr-gate.yml, which produces the required status-check contexts (#3165).
#
# Before that split, all twelve jobs lived here and none of them was a required
# context, so every one of them reported red without blocking anything -- #3116,
# #3112 and #3095 each merged with a job here in a FAILURE state. Read
# pr-gate.yml's header for which side a new guard belongs on.

on:
  pull_request:
    branches: [main]
    # The default set. 'edited', 'labeled' and 'unlabeled' were here because
    # reject-ci-skip-directives and reject-bad-closing-references read the PR
    # title and body and had to be re-run when either changed (#2159). Both moved
    # to pr-gate.yml with that reasoning, and nothing left in this file reads a
    # label, a title or a body -- so the same-SHA trigger types would only add
    # grey `cancelled` entries to the checks list under the concurrency block
    # below, for no benefit.
    types: [opened, synchronize, reopened]

# cancel-in-progress is safe HERE, and is not safe in pr-gate.yml. The difference
# is not the setting, it is what the workflow produces: a cancelled check run does
# not satisfy a required status check and nothing surfaces it as the reason a
# merge was refused (#2726). No job in this file produces a required context, and
# with the default trigger types above a superseded run's checks hang off an older
# SHA that no ruleset reads.
#
# Measured on 2026-09-03 with several agents active: 33 runs queued against 4 in
# progress, of which ~11 were superseded duplicates -- one branch had 3 PR Checks
# and 2 Test Matrices queued at once. Keeping the newest run and dropping the rest
# is the only version of that whose answer is about the tree anybody has.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruleset-drift:
    name: Required-context list must match the live branch ruleset
    runs-on: ubuntu-latest
    # The ONLINE half of check_required_contexts.py. It reads
    # GET /repos/{owner}/{repo}/rules/branches/main and fails when
    # DEFAULT_REQUIRED_CONTEXTS here or RULESET_CONTEXTS in tools/ci-wait.py has
    # drifted from what the ruleset actually requires, in either direction
    # (#2785). A required status check added in the GitHub UI would otherwise be
    # ignored by both, and ci-wait.py would keep certifying pull requests green
    # having not waited for it.
    #
    # ADVISORY on purpose, and it is the one job whose advisory status is a
    # decision rather than an oversight: it depends on a third-party API being
    # reachable, and a required context that can go red for that reason blocks
    # every merge in the repository for something no author can fix. The offline
    # half -- every required context is produced, and none of them is cancellable
    # -- does gate, from pr-gate.yml.
    #
    # Neither SKIP_RULESET_DRIFT_CHECK nor REQUIRED_CONTEXTS may be set for THIS
    # invocation; test_check_required_contexts.py asserts that at least one
    # invocation across every shipped workflow runs with no bypass at all, which
    # is this one. Setting one here would leave the guard green and silent.
    #
    # The branch-rules endpoint answers unauthenticated on a public repo;
    # GITHUB_TOKEN is passed only to buy the higher rate limit on a shared runner IP.
    steps:
      - uses: actions/checkout@v6

      - name: Check the required-context lists have not drifted from the ruleset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_required_contexts.py

  corpus-pr-resolves:
    name: A declared corpus PR URL should resolve
    runs-on: ubuntu-latest
    # The ONLINE half of the corpus-linkage guard (#3255). The offline half --
    # that a Corpus-PR or Corpus-NA trailer is present and well-formed on an
    # AL-observable diff -- gates from pr-gate.yml. This half resolves the
    # declared URL against the corpus repository, so by the rule of thumb at the
    # top of pr-gate.yml it stays advisory: it talks to api.github.com, and a
    # required context that can go red because that was unreachable blocks a
    # merge for something the author did not do.
    #
    # It reports the corpus PR's STATE; it deliberately does NOT require that
    # state to be MERGED. On the normal path described in
    # .claude/rules/bc-behavior-tests-go-upstream.md the corpus PR is still OPEN
    # while the runner PR is in review -- the orchestrator merges it once the BC
    # legs are green, and only then does the pin bump land. A check demanding
    # `merged` here would therefore be red on every correctly executed fold-case
    # PR, which is the opposite of the behaviour the rule asks for.
    #
    # What it is actually good for: catching a URL that points at nothing, at
    # the AL.Runner repository instead of the corpus, or at a PR that was
    # CLOSED WITHOUT MERGING -- the last one being the case where a runner PR
    # cites upstream verification that never happened.
    steps:
      - uses: actions/checkout@v6

      - name: Resolve any declared corpus PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          urls=$(bash .github/scripts/check_corpus_linkage.sh --print-corpus-pr-urls)
          if [ -z "${urls//[[:space:]]/}" ]; then
            echo "No Corpus-PR URL declared in this PR body; nothing to resolve."
            exit 0
          fi
          rc=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            # check_corpus_linkage.sh already emits these without a trailing
            # slash -- the gate accepts .../pull/211/, which is what copying the
            # address bar gives you, and ${url##*/} on that is the empty string,
            # so `gh pr view ""` would fail this job for a declaration the gate
            # called well-formed. Stripped again here so this loop cannot be
            # broken from a distance by a change to the extractor.
            url="${url%/}"
            num="${url##*/}"
            if ! printf '%s' "$num" | command grep -qE '^[0-9]+$'; then
              echo "::warning::Could not read a pull request number out of '$url'; skipping it."
              rc=1
              continue
            fi
            echo "Resolving corpus PR #$num ($url)"
            if ! out=$(gh pr view "$num" \
                         --repo StefanMaron/BusinessCentral.AL.Language.Tests \
                         --json state,isDraft,title,mergedAt 2>&1); then
              echo "::warning::Could not resolve $url against the corpus repository: $out"
              rc=1
              continue
            fi
            state=$(printf '%s' "$out" | python3 -c 'import json,sys;print(json.load(sys.stdin)["state"])')
            title=$(printf '%s' "$out" | python3 -c 'import json,sys;print(json.load(sys.stdin)["title"])')
            echo "  state=$state  title=$title"
            case "$state" in
              MERGED) echo "  the corpus test has merged; a real service tier has adjudicated it." ;;
              OPEN)   echo "::notice::Corpus PR #$num is still open. That is the normal state while this PR is in review -- it must merge upstream before the submodule pin can move." ;;
              CLOSED) echo "::warning::Corpus PR #$num was CLOSED WITHOUT MERGING. This PR cites upstream verification that did not happen -- check whether the BC-behaviour claim was ever adjudicated."; rc=1 ;;
            esac
          done <<< "$urls"
          exit $rc

  # validate-coverage (docs/coverage.yaml) removed at the v1->v2 cutover: v1 tracked
  # AL-language coverage in a hand-curated YAML the orchestrator validated on every PR.
  # v2's spec is the tests/al-language/ corpus itself -- every AL surface that needs
  # coverage has a real test there, so a separate hand-maintained manifest adds nothing.
  # The old file is preserved for reference at docs/archive/coverage.yaml.
  # See docs/v1-to-v2-migration.md's "Dropped" table.
