name: PR Check

on:
  pull_request:
    branches: [main]
    # 'labeled'/'unlabeled' are not in the default event set (opened, synchronize,
    # reopened), so without them applying the bypass label below triggers no new
    # run and the stale red X stays -- re-running the failed job just replays the
    # pre-label payload. 'unlabeled' re-asserts the guard when the label is
    # removed, so the bypass cannot be applied and then silently withdrawn while
    # the check still reads green.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  require-tests:
    name: Tests updated
    runs-on: ubuntu-latest
    # Skip this check when the PR carries the 'docs-only' or 'no-tests-needed' label
    if: |
      !contains(github.event.pull_request.labels.*.name, 'docs-only') &&
      !contains(github.event.pull_request.labels.*.name, 'no-tests-needed')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check that tests/ or AlRunner.Tests/ was updated when AlRunner/ changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Files changed in this PR
          CHANGED=$(git diff --name-only "$BASE"..."$HEAD")

          # Did any runtime or rewriter source change?
          SOURCE_CHANGED=$(echo "$CHANGED" | grep -E '^AlRunner/' | grep -vE '\.(md)$' || true)

          if [ -z "$SOURCE_CHANGED" ]; then
            echo "No AlRunner/ source changes — test check skipped."
            exit 0
          fi

          echo "AlRunner/ changes detected:"
          echo "$SOURCE_CHANGED"

          # Did any test file also change?
          TESTS_CHANGED=$(echo "$CHANGED" | grep -E '^(tests/|AlRunner\.Tests/)' || true)

          if [ -z "$TESTS_CHANGED" ]; then
            echo ""
            echo "ERROR: AlRunner/ was modified but no files under tests/ or AlRunner.Tests/ were updated."
            echo ""
            echo "Every change that affects behavior, mocks, or rewriter rules must include"
            echo "a test. See CONTRIBUTING.md for the requirements."
            echo ""
            echo "If this PR genuinely needs no tests (e.g. docs-only or CI infra change),"
            echo "add the 'docs-only' or 'no-tests-needed' label to bypass this check."
            exit 1
          fi

          echo ""
          echo "Test files updated:"
          echo "$TESTS_CHANGED"
          echo ""
          echo "Test presence check passed. Copilot review will assess test quality."

  release-workflow-script-tests:
    name: Release workflow script tests
    runs-on: ubuntu-latest
    # The actual test run is gated inside the job (see the "Check whether..."
    # step below) on whether publish.yml's extracted scripts or their tests
    # changed -- they're plain bash unrelated to the rest of a typical PR.
    # #2060: resolve_release_ref.sh is a new extraction of publish.yml's
    # resolve/validate logic (which ref gets pushed to, and whether the
    # dispatch can be released at all), specifically so it's provable
    # without dispatching the real release workflow.
    #
    # generate_changelog.py also has a local test file (test_generate_changelog.py)
    # from earlier #2060 work on backfilling CHANGELOG sections from published
    # tags -- deliberately NOT wired in here. Whether this workflow should
    # support releasing from a branch other than main (and, if so, what that
    # means for CHANGELOG.md) is still an open question on #2060; that script
    # change stays on the branch, unused, until it's resolved.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether the scripts or their tests changed
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED=$(git diff --name-only "$BASE"..."$HEAD")
          if echo "$CHANGED" | grep -qE '^\.github/scripts/(resolve_release_ref\.sh|test_resolve_release_ref\.sh)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run resolve_release_ref.sh tests
        if: steps.changed.outputs.run == 'true'
        run: bash .github/scripts/test_resolve_release_ref.sh

  # validate-coverage (docs/coverage.yaml) removed at the v1->v2 cutover: v1 tracked
  # AL-language coverage in a hand-curated YAML the orchestrator validated on every PR.
  # v2's spec is the tests/al-language/ corpus itself -- every AL surface that needs
  # coverage has a real test there, so a separate hand-maintained manifest adds nothing.
  # The old file is preserved for reference at docs/archive/coverage.yaml.
  # See docs/v1-to-v2-migration.md's "Dropped" table.
