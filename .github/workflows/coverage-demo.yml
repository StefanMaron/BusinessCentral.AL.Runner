name: Coverage Demo

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      # No corpus: the fixtures below are AlRunner.Tests/Fixtures/, not
      # tests/al-language. It carried `submodules: true` only because the corpus
      # used to be a submodule of this repository (#3737).
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # Two SDKs, deliberately. The projects target net8.0, so 8.0.x stays; the
          # SOLUTION is AlRunner.slnx, whose <Solution> element a 9+ SDK is needed to
          # parse at all (global.json pins that floor). An 8.0-only runner fails with
          # `error MSB4068: The element <Solution> is unrecognized`, naming neither
          # the SDK nor the solution format (#4200).
          #
          # Declaring 9.0.x is what makes the build's requirement explicit rather than
          # inherited: measured on the ubuntu24/20260907.300 image, `setup-dotnet`
          # installed 8.0.425 and the image's own preinstalled 9.x/10.x SDKs — same
          # /usr/share/dotnet — were what actually built the .slnx.
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Which .NET SDKs does this runner have? (#4200)
        # One line that turns MSB4068 into a diagnosis. Without it the build's real
        # SDK requirement is invisible: the declared version is not necessarily the
        # version doing the work, because `dotnet` resolves the highest installed SDK
        # that satisfies global.json. If a future image drops the 9+ SDK, this step is
        # what says so, beside an error message about an unrecognized XML element.
        run: dotnet --list-sdks && dotnet --version

      # --coverage (issue #1922) needs no dependency-app provisioning: it's a runtime
      # hook on Microsoft.Dynamics.Nav.Ncl.dll, auto-downloaded by the build itself.
      - name: Build (auto-downloads BC 28.1 DLLs)
        run: |
          dotnet build AlRunner.slnx \
            -p:_BCVersion=28.1 \
            -p:AllowBcArtifactDownload=true \
            -c Release

      - name: Run self-contained fixtures with --coverage
        run: |
          echo "## AL Runner Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          for fixture in RecordTriggerXRec CoverageBranch; do
            echo "::group::${fixture}"
            OUTPUT=$(./AlRunner/bin/Release/net8.0/al-runner \
              --coverage --coverage-out "cobertura-${fixture}.xml" \
              "AlRunner.Tests/Fixtures/${fixture}" 2>&1) || true
            echo "$OUTPUT"
            echo "::endgroup::"

            # Console coverage table + the test-run summary block (see Reporter.cs /
            # AlCoverageReport.FormatConsoleTable — the table rows are `  <file>  n/m  pct%`,
            # the summary block prints `pass:`/`fail:`).
            COVERAGE_LINES=$(echo "$OUTPUT" | grep -E "^  (TOTAL|[A-Za-z])" | head -20)
            RESULT_LINES=$(echo "$OUTPUT" | grep -E "^  (pass|fail|error):")

            echo "### ${fixture}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$RESULT_LINES" >> "$GITHUB_STEP_SUMMARY"
            echo "$COVERAGE_LINES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: cobertura-*.xml
