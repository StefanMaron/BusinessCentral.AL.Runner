name: Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# Two agents pushing to the same branch used to leave BOTH runs holding job slots: every
# push queued a fresh 8-leg matrix while the superseded one kept running. Measured on
# 2026-09-03 with several agents active -- 33 runs queued against 4 in progress, of which
# ~11 were superseded duplicates (one branch had 3 PR Checks and 2 Test Matrices queued at
# once, and `main` had SEVEN matrices queued, one per merge).
#
# cancel-in-progress is TRUE for both pull_request and a push to main.
#
# For a PR this is obvious: a superseded commit's verdict is worthless, and cancelling it also
# makes the stale-verdict trap in ci-verdicts.md harder to hit, since no older completed run is
# left to misread as the current one.
#
# For main it was initially set to FALSE, on the reasoning that each merged commit should keep
# its own verdict so a bad commit cannot be masked by a later merge. Measured on 2026-09-03,
# that safety net does not exist in the state where it would matter: with the queue 40 deep,
# six main runs were queued behind hours of backlog and would have reported on commits already
# six merges stale. A verdict that late cannot gate anything, and every one of those commits
# was already gated by this same matrix on its own PR before merge. So the net keeps the
# newest main run -- the only one whose answer is about the tree anybody has -- and drops the
# rest instead of holding job slots for them.
#
# #3141 narrowed the PULL-REQUEST matrix to three legs (.github/pr-bc-versions.txt);
# push is untouched and still resolves all eight. That makes this cancellation policy
# matter more, not less, for the five legs pull requests no longer run -- but the
# cadence guarantee for them does not live here. It lives in main-verdict-floor.yml
# (#3003/#3158), which runs the full eight against main's HEAD every 30 minutes unless
# that SHA already has a conclusive verdict. Adding a second schedule here would run a
# full matrix nobody asked for on top of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # #2890: a pull request that changes documentation only does not spend a BC
    # matrix on it. The decision is measured from the diff, never from a label —
    # the docs-only label is an author's assertion, and require-tests.yml already
    # honours that one for its own gate. Only pull requests are classified; a push
    # to main always runs the full matrix, because main-verdict-floor.yml reads a
    # cheap docs-only success as "this SHA has a conclusive verdict" and would then
    # never establish the eight-leg one a superseded run was cancelled out of.
    #
    # What a docs-only pull request gives up: the unit tests that read .md files
    # (BcMatrixDocumentationDriftTests, ProseRelocationPointerTests,
    # AgentWorktreePathCollisionGuardTests) run on the merge commit's push, not on
    # the pull request. A drift they catch surfaces as a red main, not a red PR.
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether this pull request changes documentation only
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "Event is '$EVENT_NAME', not pull_request: the full matrix runs whatever changed."
            exit 0
          fi
          # pr_changed_files.sh refuses an empty diff and the merge-ref endpoint trap;
          # either refusal means the measurement is broken, and a broken measurement
          # runs the matrix rather than skipping it.
          if ! files=$(bash .github/scripts/pr_changed_files.sh); then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "::warning::could not measure this pull request's diff; running the full matrix."
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | python3 .github/scripts/docs_only.py >> "$GITHUB_OUTPUT"

  bc-tests:
    # The matrix itself lives in bc-tests.yml so the release path (publish.yml)
    # runs THESE steps rather than a hand-maintained copy of them. That copy
    # drifted four times and failed two releases — see issue #1976 and the
    # comment at the top of bc-tests.yml.
    #
    # Skipped on a docs-only pull request (#2890). The `if:` is on THIS job and
    # deliberately not on all-tests below: the aggregate is the required context,
    # and it has to report on every path — see its comment.
    needs: [changes]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/bc-tests.yml

  all-tests:
    name: BC test matrix passed
    # Deliberately still a job in THIS file, not in bc-tests.yml: this is the one
    # required status check on main (the other required context is "Tests updated",
    # from require-tests.yml), and a check's context is its job name qualified by the
    # calling job. Moving it into the reusable workflow would rename it to
    # "bc-tests / BC test matrix passed" and silently leave the branch ruleset
    # requiring a check that no longer reports.
    #
    # It was called "All BC versions passed" until #3141 narrowed the pull-request
    # matrix to three legs. At that point the old name asserted that all BC versions
    # passed on a run where five of them had not been executed, and the name of a
    # required check is exactly what a person reads when deciding whether to trust a
    # green pull request. "BC test matrix passed" is true on all three paths this
    # workflow has: three legs on a pull request, eight on a push to main, eight on a
    # release (publish.yml, which calls the same reusable matrix). The step below prints
    # which versions actually gated, so the run itself says what the name deliberately
    # does not.
    #
    # On a docs-only pull request (#2890) bc-tests is skipped and this job still
    # runs, under `if: always()`, and reports success with a message saying why.
    # That is the whole trick: a `paths-ignore` on the workflow would leave the
    # required context unreported and the pull request BLOCKED forever (#2726).
    needs: [changes, bc-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Could not classify the change (result: ${{ needs.changes.result }})."
            echo "Nothing below is a verdict on the matrix — open the 'Classify the change' job."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.docs-only }}" = "true" ] && [ "${{ needs.bc-tests.result }}" = "skipped" ]; then
            echo "The BC test matrix was not run: this pull request changes documentation only (#2890)."
            echo "Every changed path ends in .md, so the runner and Business Central are unaffected."
            echo "The full matrix runs on the merge commit's push to main."
            exit 0
          fi
          # A called workflow's result is failure when any of its jobs fail, EXCEPT
          # jobs marked continue-on-error — which is how bc-tests.yml keeps the
          # informational tier available (see its resolve-versions step for why
          # nothing currently uses it). So this single check covers the whole
          # matrix and the smoke job together.
          if [ "${{ needs.bc-tests.result }}" != "success" ]; then
            echo "BC test matrix failed (result: ${{ needs.bc-tests.result }})."
            echo "Open the run and look for the red leg — every BC version gates, and"
            echo "fail-fast is off, so all failing legs are reported, not just the first."
            exit 1
          fi
          echo "The BC test matrix passed."
          echo "Which versions ran is decided by resolve-versions in bc-tests.yml:"
          echo "  pull_request        -> .github/pr-bc-versions.txt (a subset, see #3141)"
          echo "  push (main)         -> .github/bc-versions.txt (every version)"
          echo "The five versions a pull request does not run are covered on a cadence by"
          echo "main-verdict-floor.yml, which runs all eight against main every 30 minutes."
          echo "Read the 'Resolve BC versions' step of this run for the exact list it gated on."
