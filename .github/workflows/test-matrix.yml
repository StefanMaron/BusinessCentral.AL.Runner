name: Test Matrix

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      # The single REQUIRED version (28.1), for jobs that build once rather than
      # across the matrix — currently `smoke`.
      required-version: ${{ steps.resolve.outputs.required-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Resolve BC versions
        id: resolve
        run: |
          # Each prefix in bc-versions.txt → one matrix entry {bc-version, required}.
          # 28.1 is the REQUIRED gate (the version the runner is developed against);
          # older versions are informational (continue-on-error) until verified.
          BC_PREFIXES=$(cat .github/bc-versions.txt | grep -v '^#' | tr '\n' ' ')
          ENTRIES="[]"
          for prefix in $BC_PREFIXES; do
            FULL=$(dotnet run --project tools/DownloadArtifacts -- resolve-version "$prefix" dummy 2>/dev/null || true)
            if [ -n "$FULL" ]; then
              REQ=$([ "$prefix" = "28.1" ] && echo True || echo False)
              [ "$prefix" = "28.1" ] && echo "required-version=$FULL" >> "$GITHUB_OUTPUT"
              echo "  $prefix -> $FULL (required=$REQ)"
              ENTRIES=$(echo "$ENTRIES" | python3 -c "import json,sys; v=json.load(sys.stdin); v.append({'bc-version':'$FULL','required':$REQ}); print(json.dumps(v))")
            else
              echo "  $prefix -> FAILED (skipping)"
            fi
          done
          echo "matrix={\"target\":$ENTRIES}" >> "$GITHUB_OUTPUT"
          echo "Matrix: $ENTRIES"

  test:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    name: BC ${{ matrix.target.bc-version }}${{ matrix.target.required && ' (required)' || '' }}
    # Only the required leg (28.1) gates the pipeline; older versions are informational.
    continue-on-error: ${{ !matrix.target.required }}
    env:
      BC_VERSION: ${{ matrix.target.bc-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # BC 28.1 is a .NET 8 product (Server.runtimeconfig.json tfm=net8.0); the runner
      # targets net8.0 and runs it on its real runtime. (BC's Types.dll binds
      # System.Text.Json 10, which the runner deploys app-local via deps.json — see
      # AlRunner.csproj.) net8 SDK builds the runner and tools/DownloadArtifacts.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build (auto-downloads BC ${{ matrix.target.bc-version }} DLLs)
        run: |
          # AllowBcArtifactDownload=true is what actually permits the in-build fetch
          # (AlRunner.csproj target EnsureBCServiceTierDlls). Without it the sibling
          # FailIfBCServiceTierDllsMissing target hard-errors, and this step failed
          # before a single test ran — despite its name promising the download.
          dotnet build AlRunner.slnx \
            -p:_BCVersion=${{ matrix.target.bc-version }} \
            -p:AllowBcArtifactDownload=true \
            -c Release

      - name: Download R2R platform apps (Base/System Application, …)
        run: |
          # The corpus ships a SYMBOL-ONLY Base Application in its .alpackages, which is
          # enough to COMPILE but carries no runtime DLL — so cross-app tableextension tests
          # that instantiate a Base App record (e.g. Item Journal Batch / Record233) fail at
          # runtime ("no loaded type Record233"). Fetch the R2R platform apps (with DLLs) at
          # this BC version into a package cache so DependencyLoader can load the real types.
          # They're a higher version than the .alpackages symbols, so the resolver prefers them.
          dotnet run --project tools/DownloadArtifacts -- \
            platform-apps ${{ matrix.target.bc-version }} "$HOME/.al-runner/platform-apps"

      - name: Warm the Ncl Cecil rewrite cache
        run: |
          # The in-process engine tests (BcEngineCollection) can only load a rewritten
          # Ncl.dll that came from a cache HIT — a process that performs the rewrite and
          # then loads the result dies with BadImageFormatException 0x80131124, which is
          # why Program.cs re-execs after a cold rewrite. A test host cannot re-exec, so
          # it skips instead. One throwaway runner invocation populates
          # ~/.cache/al-runner/ncl-cecil so those tests actually execute below rather
          # than silently skipping on every fresh CI runner.
          # Must be a REAL run: --version/--help return long before the Cecil bootstrap.
          # The RecordTriggerXRec fixture is the smallest bundle in the repo.
          ./AlRunner/bin/Release/net8.0/al-runner --quiet AlRunner.Tests/Fixtures/RecordTriggerXRec || true
          ls -la ~/.cache/al-runner/ncl-cecil/ || echo "WARNING: Cecil cache still cold"

      - name: Run unit tests (AlRunner.Tests)
        run: |
          dotnet test AlRunner.Tests/AlRunner.Tests.csproj -c Release --no-build

      - name: Re-run in-process BC engine tests (now that the test bin's Ncl is rewritten)
        run: |
          # BcEngineFixture skips when the run itself had to rewrite
          # AlRunner.Tests/bin/…/Microsoft.Dynamics.Nav.Ncl.dll, because loading a file the
          # same process just replaced is the BadImageFormatException 0x80131124 hazard.
          # On a fresh runner that is always the FIRST run — so without this second pass
          # these two tests would skip on every CI build and quietly cover nothing.
          # The step above left bin already rewritten, so here the copy is a no-op and
          # they genuinely execute.
          dotnet test AlRunner.Tests/AlRunner.Tests.csproj -c Release --no-build \
            --filter "FullyQualifiedName~BcCompilerEmitRetryTests|FullyQualifiedName~SkeletonSharedObjectContainerLeakTests"

      - name: Run al-language corpus
        id: al-language
        run: |
          # The canonical corpus lives in the tests/al-language submodule.
          # See docs/expectations.md for how OOS-by-design tests are declared.
          #
          # --strict makes the runner exit non-zero when ANY test fails (1), a bucket
          # fails to execute (2), or a bucket fails to compile (3). The pipeline must
          # NOT report green while corpus tests fail — known runtime gaps included.
          # So this leg stays red until every corpus test passes (or its failure is
          # declared OOS-by-design in tests/expectations/, which reclassifies it to a
          # pass). Crash codes (134/139) also surface here as a non-zero exit → red.
          rc=0
          start=$SECONDS
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
              tests/al-language/tests/al-language \
              --package-cache "$HOME/.al-runner/platform-apps" \
              --strict \
              --out al-language-results.json || rc=$?
          elapsed=$(( SECONDS - start ))
          echo "elapsed=${elapsed}s" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::al-language run failed (exit $rc: 1=test failure, 2=exec fail, 3=compile fail, 134/139=crash)"
            exit "$rc"
          fi

      - name: Run runner-extras (if present)
        # always() so a failed (red) corpus leg above doesn't skip this — runner-extras
        # is an independent gate. --strict so any runner-extra failure also fails the leg.
        if: ${{ always() && hashFiles('tests/runner-extras/**/*.al') != '' }}
        run: |
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
              tests/runner-extras \
              --strict \
              --out runner-extras-results.json

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.bc-version }}
          path: |
            al-language-results.json
            runner-extras-results.json
          if-no-files-found: ignore

  smoke:
    name: Smoke ${{ matrix.tfm }}
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tfm: [net8.0]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # BC 28.1 runs on .NET 8; the runner targets net8.0. net8 SDK builds + runs it.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Clear cold-cache Cecil rewrite cache
        run: rm -rf ~/.cache/al-runner/ncl-cecil/

      - name: Build Release
        # Pin to the resolved REQUIRED version rather than AlRunner.csproj's baked-in
        # _BCVersion default: resolve-versions picks whatever 28.1.* MS currently ships,
        # so the hardcoded default goes stale the moment MS publishes a new build and
        # this job then demanded an artifact dir nothing had provisioned.
        run: |
          dotnet build AlRunner.slnx \
            -p:_BCVersion=${{ needs.resolve-versions.outputs.required-version }} \
            -p:AllowBcArtifactDownload=true \
            -c Release

      - name: Run cold-cache binary smoke test
        run: |
          set +e
          # Point at the canonical corpus app (a real bundle with a proper app.json +
          # dependency closure), NOT the submodule ROOT — the root sweeps multiple apps
          # and fixtures into one malformed bundle with no Base Application reference, so
          # any cross-app tableextension there fails to resolve (AL0185/AL0247) and aborts
          # the whole emit. The crash-gate purpose (cold Cecil rewrite + emit + run) is
          # fully exercised by the canonical app. --strict tolerated codes are 0|1|2 below.
          ./AlRunner/bin/Release/${{ matrix.tfm }}/al-runner --strict --quiet tests/al-language/tests/al-language > smoke.log 2>&1
          rc=$?
          cat smoke.log
          case "$rc" in
            0|1|2) ;;
            *)
              echo "::error::unexpected exit code $rc (expected 0, 1, or 2; crashes like 134/139 are failures)"
              exit 1
              ;;
          esac
          if ! grep -Eq '^  pass:[[:space:]]+[1-9][0-9]*$' smoke.log; then
            echo "::error::smoke output did not include a passing-test summary line"
            exit 1
          fi

  all-tests:
    name: All BC versions passed
    needs: [resolve-versions, test, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        run: |
          # `test.result` is success when all non-continue-on-error legs pass —
          # i.e. the required 28.1 leg. Older (informational) legs may fail freely.
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Required BC version (28.1) test leg failed (result: ${{ needs.test.result }})"
            exit 1
          fi
          if [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "Smoke job failed (result: ${{ needs.smoke.result }})"
            exit 1
          fi
          echo "Required BC version (28.1) + smoke passed."
