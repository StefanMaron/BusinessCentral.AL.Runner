name: Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# Two agents pushing to the same branch used to leave BOTH runs holding job slots: every
# push queued a fresh 8-leg matrix while the superseded one kept running. Measured on
# 2026-09-03 with several agents active -- 33 runs queued against 4 in progress, of which
# ~11 were superseded duplicates (one branch had 3 PR Checks and 2 Test Matrices queued at
# once, and `main` had SEVEN matrices queued, one per merge).
#
# cancel-in-progress is deliberately TRUE for pull_request and FALSE for a push to main.
# A superseded commit's PR verdict is worthless, and cancelling it also makes the stale-verdict
# trap in ci-verdicts.md harder to hit. A push to main is different: each main commit keeps its
# own verdict, so a bad commit cannot be masked by a later merge cancelling its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bc-tests:
    # The matrix itself lives in bc-tests.yml so the release path (publish.yml)
    # runs THESE steps rather than a hand-maintained copy of them. That copy
    # drifted four times and failed two releases — see issue #1976 and the
    # comment at the top of bc-tests.yml.
    uses: ./.github/workflows/bc-tests.yml

  all-tests:
    name: All BC versions passed
    # Deliberately still a job in THIS file, not in bc-tests.yml: "All BC versions
    # passed" is the one required status check on main, and a check's context is
    # its job name qualified by the calling job. Moving it into the reusable
    # workflow would rename it to "bc-tests / All BC versions passed" and silently
    # leave the branch ruleset requiring a check that no longer reports.
    needs: [bc-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs succeeded
        run: |
          # A called workflow's result is failure when any of its jobs fail, EXCEPT
          # jobs marked continue-on-error — which is how bc-tests.yml keeps the
          # informational tier available (see its resolve-versions step for why
          # nothing currently uses it). So this single check covers the whole
          # matrix and the smoke job together.
          if [ "${{ needs.bc-tests.result }}" != "success" ]; then
            echo "BC test matrix failed (result: ${{ needs.bc-tests.result }})."
            echo "Open the run and look for the red leg — every BC version gates, and"
            echo "fail-fast is off, so all failing legs are reported, not just the first."
            exit 1
          fi
          echo "All required BC versions + smoke passed."
