name: Publish to NuGet

# Triggered manually only — supply the version and the workflow does everything:
# generates the CHANGELOG section, commits it to main, pushes the tag, runs
# tests, packs, pushes to NuGet, and creates the GitHub Release.
#
# The checkout step uses RELEASE_DEPLOY_KEY (a write-access deploy key) so the
# git push to main bypasses the branch ruleset ("Deploy keys" -> Always allow).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.23)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.changelog.outputs.notes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate CHANGELOG and push release commit + tag
        id: changelog
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"

          # Idempotent retry: if a prior run for this version already got as far as
          # pushing the release commit + tag (then failed later, e.g. in `test`), a
          # naive re-run would generate and commit a SECOND [x.y.z] section — exactly
          # what happened on 2026-08-05 (two duplicate v2.0.0 sections, cleaned up by
          # hand). Detect the existing tag and reuse its CHANGELOG section instead of
          # regenerating.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — reusing its release commit, not re-committing."
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            SECTION=$(git show "$TAG:CHANGELOG.md" | awk -v ver="## [$VERSION]" '
              $0 == ver { found=1 }
              found && /^## \[/ && $0 != ver { exit }
              found { print }
            ')
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s")
            else
              COMMITS=$(git log --pretty=format:"%s")
            fi

            SECTION=$(VERSION="$VERSION" DATE="$(date +%Y-%m-%d)" COMMITS="$COMMITS" \
              python3 .github/scripts/generate_changelog.py)

            git add CHANGELOG.md
            git commit -m "chore: release v${VERSION}"
            git push origin main
            git tag "$TAG"
            git push origin "$TAG"
          fi

          {
            echo "notes<<EOF_NOTES"
            echo "$SECTION"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  resolve-versions:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Resolve BC versions
        id: resolve
        run: |
          BC_PREFIXES=$(cat .github/bc-versions.txt | grep -v '^#' | tr '\n' ' ')
          VERSIONS="[]"
          for prefix in $BC_PREFIXES; do
            FULL=$(dotnet run --project tools/DownloadArtifacts -- resolve-version "$prefix" dummy 2>/dev/null || true)
            if [ -n "$FULL" ]; then
              VERSIONS=$(echo "$VERSIONS" | python3 -c "import json,sys; v=json.load(sys.stdin); v.append('$FULL'); print(json.dumps(v))")
            fi
          done
          echo "matrix={\"bc-version\":$VERSIONS}" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    name: Test BC ${{ matrix.bc-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}
          submodules: true
      # BC 28.1 runs on .NET 8; the runner targets net8.0 (BC's System.Text.Json 10
      # bind is satisfied app-local via deps.json — see AlRunner.csproj).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build (auto-downloads BC ${{ matrix.bc-version }} DLLs)
        run: |
          # AllowBcArtifactDownload=true permits the in-build fetch; without it
          # AlRunner.csproj's FailIfBCServiceTierDllsMissing hard-errors. Same defect
          # as test-matrix.yml had.
          dotnet build AlRunner.slnx \
            -p:_BCVersion=${{ matrix.bc-version }} \
            -p:AllowBcArtifactDownload=true \
            -c Release

      - name: Download R2R platform apps (Base/System Application, …)
        run: |
          # See test-matrix.yml's identical step: the corpus ships a SYMBOL-ONLY Base
          # Application in its .alpackages (compiles, no runtime DLL), so cross-app
          # tableextension/report/xmlport tests fail at runtime without the real R2R
          # platform apps in a package cache. This job was missing this step entirely —
          # 17 corpus tests failed on BC 27.3 without it (2026-08-05 release attempts),
          # despite the identical commit passing clean in test-matrix.yml.
          dotnet run --project tools/DownloadArtifacts -- \
            platform-apps ${{ matrix.bc-version }} "$HOME/.al-runner/platform-apps"

      - name: Download the Microsoft test toolkit (Any, Library Assert, Test Runner, …)
        run: |
          dotnet run --project tools/DownloadArtifacts -- \
            test-apps ${{ matrix.bc-version }} "$HOME/.al-runner/test-apps"

      - name: Run unit tests (AlRunner.Tests)
        run: |
          dotnet test AlRunner.Tests/AlRunner.Tests.csproj -c Release --no-build

      - name: Run al-language corpus
        run: |
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
            tests/al-language/tests/al-language \
            --package-cache "$HOME/.al-runner/platform-apps" \
            --strict \
            --out al-language-results.json

      - name: Run runner-extras (if present)
        if: ${{ hashFiles('tests/runner-extras/**/*.al') != '' }}
        run: |
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
            tests/runner-extras \
            --package-cache "$HOME/.al-runner/platform-apps" \
            --package-cache "$HOME/.al-runner/test-apps" \
            --strict \
            --out runner-extras-results.json

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build and pack
        run: |
          # Packing also needs the BC service tier present (RAR resolves against it),
          # so the same download switch applies here. This job builds once at the
          # csproj's default _BCVersion, which is the version the package is stamped
          # with (AssemblyMetadata BcEngineVersion).
          dotnet build AlRunner/ -p:AllowBcArtifactDownload=true
          dotnet pack AlRunner/ -p:AllowBcArtifactDownload=true -p:Version=${{ inputs.version }} -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ needs.prepare.outputs.notes }}
          files: ./nupkg/*.nupkg
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "## Published to NuGet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** [MSDyn365BC.AL.Runner](https://www.nuget.org/packages/MSDyn365BC.AL.Runner/${{ inputs.version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** [v${{ inputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }})" >> "$GITHUB_STEP_SUMMARY"
