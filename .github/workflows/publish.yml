name: Publish to NuGet

# Triggered manually only — supply the version and the workflow does everything:
# generates the CHANGELOG section, commits it to main, pushes the tag, runs
# tests, packs, pushes to NuGet, and creates the GitHub Release.
#
# The checkout step uses RELEASE_DEPLOY_KEY (a write-access deploy key) so the
# git push to main bypasses the branch ruleset ("Deploy keys" -> Always allow).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.23)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.changelog.outputs.notes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate CHANGELOG and push release commit + tag
        id: changelog
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"

          # Idempotent retry: if a prior run for this version already got as far as
          # pushing the release commit + tag (then failed later, e.g. in `test`), a
          # naive re-run would generate and commit a SECOND [x.y.z] section — exactly
          # what happened on 2026-08-05 (two duplicate v2.0.0 sections, cleaned up by
          # hand). Detect the existing tag and reuse its CHANGELOG section instead of
          # regenerating.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — reusing its release commit, not re-committing."
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            SECTION=$(git show "$TAG:CHANGELOG.md" | awk -v ver="## [$VERSION]" '
              $0 == ver { found=1 }
              found && /^## \[/ && $0 != ver { exit }
              found { print }
            ')
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s")
            else
              COMMITS=$(git log --pretty=format:"%s")
            fi

            SECTION=$(VERSION="$VERSION" DATE="$(date +%Y-%m-%d)" COMMITS="$COMMITS" \
              python3 .github/scripts/generate_changelog.py)

            git add CHANGELOG.md
            git commit -m "chore: release v${VERSION}"
            git push origin main
            git tag "$TAG"
            git push origin "$TAG"
          fi

          {
            echo "notes<<EOF_NOTES"
            echo "$SECTION"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    # The SAME matrix the push / pull-request path runs — resolve-versions, every
    # BC version, and the cold-cache smoke job — checked out at the release tag.
    #
    # This used to be a hand-maintained copy of those steps living in this file.
    # It drifted from the original four times, and the last two divergences failed
    # a release each (v2.3.0 and v2.3.1, both on BcEngineReadinessGuardTests with
    # 47 engine tests skipped). Calling the definition instead of restating it is
    # the fix — issue #1976.
    #
    # It also closes a gap that was never a "drift" so much as a permanent
    # shortfall: the old copy ran neither --count-baseline, nor the xmlport
    # order-independence guard, nor the server-mode integration tests, nor the
    # smoke job. A release was gated on strictly less than a pull request.
    uses: ./.github/workflows/bc-tests.yml
    with:
      ref: v${{ inputs.version }}

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install the aarch64 cross-compiler (#1672)
        run: |
          # This runner is linux-x64; AlRunner.csproj's BuildWin32PrebuiltStubs target
          # uses the native `cc` for linux-x64 (always present) and this cross
          # toolchain for linux-arm64, so a single x64 job ships prebuilt Win32
          # stubs for both RIDs without needing an arm64 runner.
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build and pack
        run: |
          # Packing also needs the BC service tier present (RAR resolves against it),
          # so the same download switch applies here. This job builds once at the
          # csproj's default _BCVersion, which is the version the package is stamped
          # with (AssemblyMetadata BcEngineVersion). It also runs
          # BuildWin32PrebuiltStubs (see AlRunner.csproj) which ships the prebuilt
          # libwin32_stubs.linux-{x64,arm64}.so shims in the resulting nupkg.
          #
          # #1881's Directory.Build.props turns OFF IncludeSourceRevisionInInformationalVersion
          # and SuppressImplicitGitSourceLink=true repo-wide, so every dev/CI build of
          # al-runner.dll is content-addressable (RunnerFingerprint.ContentHash stops
          # being a hash of the commit). This is the ONE place that must turn them back
          # ON: `dotnet pack`'s nuspec RepositoryUrl/RepositoryCommit come from
          # SourceLink's git task, and PackAsTool=true (AlRunner.csproj) ships this to
          # nuget.org under MSDyn365BC.AL.Runner — losing that would silently strip
          # commit provenance / source-stepping from every released package.
          #
          # Safe to override here specifically: a released package's bytes are fixed for a
          # given version, so the ContentHash an end user's run computes from it is stable.
          # Commit-embedding only invalidates caches when the SAME code is rebuilt
          # commit-to-commit — the dev/CI/test-matrix path, never the release path.
          dotnet build AlRunner/ -p:AllowBcArtifactDownload=true
          dotnet pack AlRunner/ -p:AllowBcArtifactDownload=true -p:Version=${{ inputs.version }} \
            -p:SuppressImplicitGitSourceLink=false -p:IncludeSourceRevisionInInformationalVersion=true \
            -o ./nupkg

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ needs.prepare.outputs.notes }}
          files: ./nupkg/*.nupkg
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "## Published to NuGet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** [MSDyn365BC.AL.Runner](https://www.nuget.org/packages/MSDyn365BC.AL.Runner/${{ inputs.version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** [v${{ inputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }})" >> "$GITHUB_STEP_SUMMARY"
