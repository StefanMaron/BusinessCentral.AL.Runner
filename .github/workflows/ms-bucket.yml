name: MS bucket (manual)

# Runs Microsoft BaseApp test buckets through AL Runner in the full configuration —
# including --test-data — and reports total / pass / fail / error and wall time in the job
# summary. Issue #2724.
#
# ONE BUCKET, OR A LIST OF THEM IN ONE JOB (#3409)
#   `bucket` takes one name; `buckets` takes several, comma- or newline-separated, and wins
#   when both are given. A list runs SEQUENTIALLY in this single job — provisioning, the
#   977 MB backup and the compile caches are paid once for all of them, which is the whole
#   reason a list exists. .github/workflows/ms-surface.yml passes all 32 non-empty buckets
#   this way to measure the full Microsoft surface.
#
#   Each bucket gets its OWN runner process. Peak RSS tracks how many bundles a process
#   loads, not how many tests it runs — measured, 3 bundles / 939 tests peaked at 4.4 GB
#   against 1 bundle / 1,027 tests at 3.7 GB — so handing 32 bundle directories to one
#   invocation would stack their memory on a runner that has already peaked at 10.9 GiB on
#   Tests-ERM alone. Separate processes reset it between buckets.
#
#   Each bucket's numbers are written to the job summary and emitted as a workflow
#   annotation BEFORE the next bucket starts. A hosted job cannot run longer than 360
#   minutes and that ceiling cannot be raised, so a long list must not have "the job was
#   killed, so you get nothing" as its failure mode.
#
# This is a VERIFICATION NET, not a gate:
#   * `on: workflow_dispatch` only. No push, no pull_request, no schedule. A 9,500-test
#     bucket is a multi-hour job and must never land on a PR.
#   * Not a required check and not in any branch ruleset. Nothing about `main`'s gate
#     ("BC test matrix passed", test-matrix.yml) changes.
#   * It measures; it does not try to make the suite green. The job is GREEN when it
#     produced a number (runner exit 0 or 1 plus a JUnit file) and RED only when it did not
#     (compile fail, exec fail, crash, or no JUnit) — thousands of failing tests are the
#     expected outcome and are reported, not failed on.
#
# Why it exists: running the Microsoft surface on a developer desktop competes with the
# implementation agents for memory and has OOMed the machine twice. A hosted runner gives a
# trustworthy number without that contention.
#
# What it reuses (see the composite action's description and bc-tests.yml's header for why
# these steps are never hand-copied): .github/actions/provision-bc builds the runner against
# the BC version and fills BOTH package caches. Everything the matrix does NOT provision is
# fetched here through the same ranged-ZIP read tools/DownloadArtifacts already uses:
#   * `test-sources` — the bucket's Source.zip, from the platform artifact (2.4 MB for ERM);
#   * `test-data`    — BusinessCentral-W1.bak from the sandbox w1 artifact (~977 MB), streamed
#                      to disk and cached across runs with actions/cache keyed on the build;
#   * the backup reader `bcbak` — StefanMaron/BusinessCentral.DbReader's Native AOT
#                      `bcdb-linux-x64` release asset, checksum-verified, installed under the
#                      old name the runner probes (BackupReaderTool.cs).
#
# Configuration recorded from working local runs — wrong values do not fail the run, they
# make its number meaningless (AlRunner.Tests/MsBucketWorkflowTests.cs pins them):
#   * company `CRONUS International Ltd_` — SQL form, TRAILING UNDERSCORE, not a period;
#   * both --package-cache directories;
#   * AL_RUNNER_EMIT_TIMEOUT_SEC far above the 120 s default (Tests-ERM's emit alone is
#     minutes);
#   * a private --cache root, never the shared default.
#
# Reading the number — two known ways it can be wrong until their fixes land, both surfaced
# verbatim in the summary by scripts/ms-bucket-summary.py:
#   * a bundle lost to COMPILE FAIL silently vanishes from the totals (#2715; #2721 adds a
#     "NOT RUN: N bundle(s)" line);
#   * a run resumed after a watchdog abort (--resume-aborts, default 5) carries earlier
#     attempts forward via --merge-counts; #2716 / #2720 cover the JUnit under-reporting that
#     came with it. The "resume:" and "(carried from earlier attempt(s): …)" lines tell you it
#     happened.
# Always state whether a number was measured WITH or WITHOUT --test-data: the two differ by
# 3x on Tests-SINGLESERVER and are not comparable.
#
# WHICH BC BUILDS --test-data CAN ACTUALLY BE MEASURED ON, as of reader v0.1.2 (#2779, #2780)
#   Reader v0.1.1 opened the W1 demo backup for BC 28.1 and older and REFUSED 28.2, 28.3 and
#   28.4 with "block N of MSDA region is neither mapped by the derived extent list nor padding
#   filler — backup layout differs from the derived model, refusing to guess" (BcDb.Core's
#   PageFile). That was never a regression — v0.1.0, v0.1.1 and the source build before both
#   refused identically, so the reader had never read a 28.2+ backup — and it meant this
#   workflow's DEFAULT bc-version could not produce a --test-data number at all.
#
#   v0.1.2 reads them. Measured directly with the pinned binary, one `bcdb companies` per
#   backup:
#
#     27.5.46862.48827  OK      28.2.50931.54319  OK
#     28.1.49838.50621  OK      28.3.52162.54309  OK
#     28.1.49838.54308  OK      28.4.53241.54318  OK
#
#   28.0.46665.54310 was not re-measured (no local backup); v0.1.1 read it and v0.1.2 changes
#   only the refusal path, so it is expected to keep reading it. The pin comment on READER_TAG
#   below carries the v0.1.1-vs-v0.1.2 comparison and the decoded-value check behind the bump.
#
#   So the default bc-version (the newest prefix in .github/bc-versions.txt, currently 28.4)
#   is expected to produce a --test-data number. `bcdb companies` succeeding is not the same
#   as a whole bucket run succeeding: the first full run on 28.4 is the confirmation, and if
#   it fails it should fail for a NEW reason, surfaced verbatim by
#   scripts/ms-bucket-summary.py's caveat scanner (which matches the runner's
#   "=== <bundle> — EXEC FAIL ===" header and its reason lines generically, not the MSDA text).

on:
  # workflow_call so the nightly (ms-bucket-nightly.yml) can REUSE these steps rather than
  # re-spell them. Deliberately no push/pull_request/schedule here: this workflow is the
  # MECHANICS of running one bucket, and every policy question — which bucket, how often,
  # what the result asserts — belongs to whoever calls it. A schedule on this file would also
  # arrive with no inputs, so `bucket` would be empty. MsBucketWorkflowTests pins the trigger
  # set in both directions.
  workflow_call:
    inputs:
      bucket:
        description: Microsoft BaseApp test bucket, e.g. Tests-SMB or Tests-ERM.
        type: string
        required: false
        default: ''
      buckets:
        description: >-
          Several buckets, comma- or newline-separated, run sequentially in this one job.
          Wins over `bucket` when both are given.
        type: string
        required: false
        default: ''
      label:
        description: >-
          Names the run in the job title, the concurrency group and the uploaded artifact.
          Defaults to the single bucket's name. A list run MUST pass one: without it every
          list run shares one concurrency group and they queue behind each other silently.
        type: string
        required: false
        default: ''
      expected-tests:
        description: >-
          How many tests this set of buckets is expected to hold. 0 = do not compare. The
          combined-total step says so when the measured total falls well short, because a
          bundle lost to COMPILE FAIL vanishes from the totals rather than failing them
          (#2715).
        type: number
        required: false
        default: 0
      bc-version:
        description: >-
          BC build or prefix. Empty = the newest prefix in .github/bc-versions.txt.
        type: string
        required: false
        default: ''
      test-data:
        description: Hydrate CRONUS International Ltd_ from the sandbox backup.
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      bucket:
        description: >-
          Microsoft BaseApp test bucket — the <name> in Applications/BaseApp/Test/<name>.Source.zip
          (Tests-ERM, Tests-SCM, Tests-Misc, Tests-Cash Flow, …). A wrong name fails fast and
          lists what the artifact ships.
        type: string
        required: false
        default: Tests-ERM
      buckets:
        description: >-
          Several buckets instead of one, comma- or newline-separated (Tests-SMB,Tests-Bank).
          Wins over `bucket` when both are filled in. They run SEQUENTIALLY in this one job
          and share its provisioning, backup and compile caches.
        type: string
        required: false
        default: ''
      label:
        description: >-
          Names the run in the job title, the concurrency group and the artifact. Defaults to
          the single bucket's name.
        type: string
        required: false
        default: ''
      expected-tests:
        description: >-
          How many tests this set of buckets is expected to hold; 0 = do not compare. Set it on
          a partial-surface dispatch too — without it the shortfall warning is off, and a bundle
          lost to COMPILE FAIL vanishes from the totals rather than failing them (#2715).
        type: number
        required: false
        default: 0
      bc-version:
        description: >-
          BC build: a full four-part build (28.4.53241.54318) or a prefix (28.4) resolved to
          its newest published build. Empty = the newest prefix in .github/bc-versions.txt,
          the one the matrix marks required.
        type: string
        required: false
        default: ''
      test-data:
        description: >-
          Hydrate CRONUS International Ltd_ from the sandbox backup (--test-data). Off measures
          the empty-database number, which is a different number.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# One run per bucket (or per labelled set) at a time. A second dispatch of the same thing
# queues behind the first rather than cancelling a multi-hour measurement in flight.
#
# The label is in the group for a reason that is invisible when it goes wrong: a list run
# passes no `bucket`, so on `ms-bucket-${{ inputs.bucket }}` alone every list run would land
# in the group `ms-bucket-` and, with cancel-in-progress false, wait for the previous one.
# That is a silent queue, not an error.
concurrency:
  group: ms-bucket-${{ inputs.label || inputs.bucket || 'list' }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  run:
    name: ${{ inputs.label || inputs.bucket || 'buckets' }} on BC ${{ inputs.bc-version || 'newest' }}
    runs-on: ubuntu-latest
    # The hosted maximum, and it cannot be raised. Tests-SINGLESERVER (834 tests) takes ~4
    # minutes warm; Tests-ERM is 11x the tests plus a cold build, provisioning and a cold
    # emit; the whole 40,530-test surface is a few hours. This is why every bucket's numbers
    # are reported as it finishes rather than at the end.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      # The provisioning action sets up .NET too; this earlier copy is for the version
      # resolution below, which has to run BEFORE the action can be given a version.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve the BC build
        id: bc
        env:
          REQUESTED: ${{ inputs.bc-version }}
        run: |
          # Same resolver bc-tests.yml uses (tools/DownloadArtifacts resolve-version), never a
          # second implementation of it — re-resolving differently is the drift #2010 was.
          req="${REQUESTED// /}"
          if [ -z "$req" ]; then
            req=$(grep -v '^#' .github/bc-versions.txt | tr ' ' '\n' | grep . | sort -V | tail -1)
            echo "No version given; using the newest prefix in .github/bc-versions.txt: $req"
          fi
          dots=$(printf '%s' "$req" | tr -dc . | wc -c)
          if [ "$dots" -eq 3 ]; then
            full="$req"
          else
            full=$(dotnet run --project tools/DownloadArtifacts -- resolve-version "$req" 2>/dev/null || true)
            if [ -z "$full" ]; then
              echo "::error::could not resolve BC '$req' to a published build"
              exit 1
            fi
          fi
          echo "version=$full" >> "$GITHUB_OUTPUT"
          echo "BC build: $full"

      # BEFORE provisioning on purpose: an empty or duplicated list costs seconds to reject
      # here and 12 minutes of provisioning to reject after it.
      - name: Resolve the bucket list
        id: plan
        env:
          BUCKET: ${{ inputs.bucket }}
          BUCKETS: ${{ inputs.buckets }}
        run: |
          list="$BUCKETS"
          if [ -n "$(printf '%s' "$list" | tr -d '[:space:],')" ]; then
            if [ -n "$(printf '%s' "$BUCKET" | tr -d '[:space:]')" ]; then
              echo "::notice::both 'bucket' and 'buckets' were given; the list wins and '$BUCKET' is ignored"
            fi
          else
            list="$BUCKET"
          fi
          # Comma OR newline separated, so a caller can write either.
          printf '%s\n' "$list" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep . > "$RUNNER_TEMP/buckets.txt" || true
          count=$(wc -l < "$RUNNER_TEMP/buckets.txt")
          if [ "$count" -eq 0 ]; then
            echo "::error::no bucket to run — give 'bucket' or 'buckets'"
            exit 1
          fi
          # A bucket named twice would be RUN twice and counted twice in the combined total,
          # which is a wrong number rather than a failure — so it is refused here.
          dupes=$(sort "$RUNNER_TEMP/buckets.txt" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::bucket(s) named more than once, which would double-count them: $dupes"
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Running $count bucket(s):"
          nl -ba "$RUNNER_TEMP/buckets.txt"

      - uses: ./.github/actions/provision-bc
        with:
          bc-version: ${{ steps.bc.outputs.version }}

      - name: Fetch the bucket sources
        run: |
          mapfile -t BUCKET_LIST < "$RUNNER_TEMP/buckets.txt"
          for bucket in "${BUCKET_LIST[@]}"; do
            dotnet run --project tools/DownloadArtifacts -- \
              test-sources ${{ steps.bc.outputs.version }} "$RUNNER_TEMP/ms-buckets" "$bucket"
            bundle="$RUNNER_TEMP/ms-buckets/$bucket"
            echo "AL files in $bundle: $(find "$bundle" -name '*.al' | wc -l)"
            test -f "$bundle/app.json"
          done

      - name: Install the backup reader (bcbak)
        if: ${{ inputs.test-data }}
        id: reader
        env:
          # PINNED, deliberately (#2779). This used to resolve the LATEST release at run time
          # (`gh release view … --jq .tagName`), which made this workflow's result depend on
          # when another repository last published — a change here could not explain a change
          # in the answer, and the first run's failure was investigated as a reader regression
          # partly because the tag had moved between the working local baseline and CI. It had
          # not regressed; but the workflow's own comment already said the reader's identity
          # keys the install-baseline cache and that a reader fix changes DECODED VALUES, which
          # is an argument for pinning it, not for floating it.
          #
          # To move it: pick the new tag from
          # https://github.com/StefanMaron/BusinessCentral.DbReader/releases, run this
          # workflow once on the new pin, and compare the pass/fail totals against the previous
          # pin's run before merging the bump. A reader upgrade that changes decoded values
          # changes this measurement, so the bump belongs in its own PR with both numbers in
          # the body.
          #
          # v0.1.1 -> v0.1.2 (#2780). v0.1.1 could not open the W1 demo backup for BC 28.2 and
          # newer at all -- `bcdb companies` exited 1 with "block <N> of MSDA region is neither
          # mapped by the derived extent list nor padding filler" -- so with test-data: true the
          # workflow's DEFAULT bc-version (the newest prefix in .github/bc-versions.txt, 28.4)
          # could not produce a number. Measured on the real backups, one binary per row, both
          # release assets checksum-verified against their SHA256SUMS:
          #
          #     BC        v0.1.1                     v0.1.2
          #     28.1      OK                         OK
          #     28.2      refused (block 116296)     OK
          #     28.3      refused (block 116288)     OK
          #     28.4      refused (block 116504)     OK
          #
          # The totals comparison this comment asks for cannot be done like-for-like at 28.2+,
          # because the OLD pin produces no number there at all -- that is the bug. So the
          # decoded-value question was answered where both readers CAN read, on 28.1: the
          # `bcdb tables` listing is byte-identical (3,956 lines) and a `bcdb read` of
          # "Source Code Setup" is byte-identical between the two. v0.1.2 adds versions it can
          # open; it does not change what it decodes on the versions v0.1.1 already opened.
          READER_TAG: v0.1.2
          GH_TOKEN: ${{ github.token }}
        run: |
          # bcbak is StefanMaron/BusinessCentral.DbReader's `bcdb`, consumed as a pinned
          # release's Native AOT asset rather than built here: a source build needs the .NET 10
          # SDK plus clang and adds minutes, and the release binary is the one that repo's own
          # hermetic test suite gated before publishing. The runner probes the OLD name at
          # ~/.cache/al-runner/bcbak/bcbak (BackupReaderTool.CandidateExecutables), so the
          # asset is installed under that name. The tag lands in the summary: the reader's
          # identity keys the install-baseline cache and a reader fix changes decoded values.
          tag="$READER_TAG"
          mkdir -p "$RUNNER_TEMP/reader"
          cd "$RUNNER_TEMP/reader"
          # StefanMaron/BusinessCentral.DbReader, NOT .BakReader: that repository was renamed,
          # and the old name only still works because GitHub redirects it. A rename redirect is
          # not a contract -- it lasts at GitHub's discretion, and it stops the moment anyone
          # creates a new repository at the freed-up old name, at which point this line
          # downloads someone else's asset or 404s in a nightly nobody is watching closely.
          gh release download "$tag" --repo StefanMaron/BusinessCentral.DbReader \
            --pattern bcdb-linux-x64 --pattern SHA256SUMS
          grep 'bcdb-linux-x64$' SHA256SUMS | sha256sum -c -
          install -D -m 0755 bcdb-linux-x64 "$HOME/.cache/al-runner/bcbak/bcbak"
          "$HOME/.cache/al-runner/bcbak/bcbak" --version
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore the cached backup
        if: ${{ inputs.test-data }}
        id: bak-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.al-runner/test-data/${{ steps.bc.outputs.version }}
          key: bc-test-data-w1-${{ steps.bc.outputs.version }}

      - name: Fetch the backup (BusinessCentral-W1.bak)
        if: ${{ inputs.test-data && steps.bak-cache.outputs.cache-hit != 'true' }}
        run: |
          dotnet run --project tools/DownloadArtifacts -- \
            test-data ${{ steps.bc.outputs.version }} "$HOME/.al-runner/test-data/${{ steps.bc.outputs.version }}" w1

      # Explicit restore/save pair rather than actions/cache: its implicit save runs only
      # when the job succeeds, and a multi-hour bucket run can legitimately end red (no
      # number) for reasons that have nothing to do with the backup. The 1 GB download is
      # worth keeping either way.
      - name: Save the backup to the cache
        if: ${{ inputs.test-data && steps.bak-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.al-runner/test-data/${{ steps.bc.outputs.version }}
          key: bc-test-data-w1-${{ steps.bc.outputs.version }}

      - name: Run the bucket(s)
        id: run
        env:
          # The 120 s default is sized for a corpus app, not a 9,500-test bucket whose emit
          # alone is minutes. #2721 scales the default by --jobs worker count; this is a single
          # process, so the base value is what applies.
          AL_RUNNER_EMIT_TIMEOUT_SEC: "3600"
          # Explicit, not left to the runner's core count. Server GC sizes its heaps from the
          # CPU count and those heaps are ~90% of peak RSS: Tests-ERM peaked at 10.9 GiB on a
          # 12-core box, and a hosted runner has 4 vCPU and 16 GB. Two heaps buys margin on the
          # largest bucket at a small throughput cost.
          #
          # DOTNET_GCHeapHardLimit is deliberately NOT used and must not be added: below about
          # 1.25 GB it silently changed test RESULTS (259 passing became 212), so it would
          # corrupt the number this workflow exists to produce rather than fail loudly.
          #
          # The value is read as HEX, like every DOTNET_GC* knob. "2" means 2 either way; a
          # later edit to "16" would mean 22 heaps, not 16.
          DOTNET_GCHeapCount: "2"
          BC_VERSION: ${{ steps.bc.outputs.version }}
          WITH_TEST_DATA: ${{ inputs.test-data }}
          READER: ${{ steps.reader.outputs.tag }}
        run: |
          set +e
          mapfile -t BUCKET_LIST < "$RUNNER_TEMP/buckets.txt"
          total=${#BUCKET_LIST[@]}
          bak="$HOME/.al-runner/test-data/$BC_VERSION/BusinessCentral-W1.bak"
          # cwd OUTSIDE the checkout: the runner auto-probes ./tests/expectations from cwd as
          # a fallback (ExpectationsDirectoryResolution.cs), and the corpus manifest has no
          # business reclassifying a Microsoft bucket.
          cd "$RUNNER_TEMP"
          i=0
          for bucket in "${BUCKET_LIST[@]}"; do
            i=$((i + 1))
            # Bucket names contain spaces (Tests-Cash Flow); the directory name must not.
            slug=$(printf '%s' "$bucket" | tr ' /' '__')
            out="$GITHUB_WORKSPACE/results/$slug"
            mkdir -p "$out"
            printf '%s\n' "$bucket" > "$out/bucket.txt"
            args=( "$RUNNER_TEMP/ms-buckets/$bucket"
                   --package-cache "$HOME/.al-runner/platform-apps"
                   --package-cache "$HOME/.al-runner/test-apps"
                   --cache "$RUNNER_TEMP/al-runner-cache"
                   --output-junit "$out/junit.xml"
                   --out "$out/results.json"
                   --quiet )
            if [ "$WITH_TEST_DATA" = "true" ]; then
              # SQL form of the company name: trailing underscore. With a period the run fails
              # loudly and lists both companies.
              args+=( "--test-data=$bak" --test-data-company "CRONUS International Ltd_" )
            fi
            echo "::group::[$i/$total] $bucket"
            start=$SECONDS
            "$GITHUB_WORKSPACE/AlRunner/bin/Release/net8.0/al-runner" "${args[@]}" 2>&1 \
              | tee "$out/run.log"
            rc=${PIPESTATUS[0]}
            elapsed=$(( SECONDS - start ))
            echo "runner exit code: $rc (1 = tests failed, the expected outcome)"
            echo "::endgroup::"
            printf '%s\n' "$rc" > "$out/rc.txt"
            printf '%s\n' "$elapsed" > "$out/elapsed.txt"
            # This bucket's numbers reach the job summary and the run's annotations NOW, before
            # the next one starts. --notice is what survives a job killed at the 360-minute
            # ceiling: an annotation is emitted through the log stream as it happens, whereas a
            # step summary is only finalised when the step ends, and this step is the whole run.
            python3 "$GITHUB_WORKSPACE/scripts/ms-bucket-summary.py" \
              --log "$out/run.log" --junit "$out/junit.xml" \
              --rc "$rc" --elapsed "$elapsed" \
              --bucket "$bucket" --bc-version "$BC_VERSION" \
              --test-data "$WITH_TEST_DATA" --reader "$READER" \
              --notice \
              --out "$out/summary.md" \
              --step-summary "$GITHUB_STEP_SUMMARY"
          done
          # Always 0: the verdict belongs to the combined-total step below, which sees every
          # bucket. Failing here would skip it and lose the one number this run is for.
          exit 0

      # The verdict, and the deliverable. Green when every requested bucket produced a number
      # (runner exit 0/1 plus a JUnit file); red when one did not. Thousands of FAILING tests
      # are the expected outcome of a Microsoft bucket and are reported, not failed on.
      - name: Combined total
        if: always()
        run: |
          python3 scripts/ms-bucket-total.py \
            --results results \
            --buckets "$RUNNER_TEMP/buckets.txt" \
            --bc-version "${{ steps.bc.outputs.version }}" \
            --test-data "${{ inputs.test-data }}" \
            --expected-tests "${{ inputs.expected-tests || 0 }}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # One directory per bucket: results/<bucket>/{junit.xml,results.json,run.log,summary.md}.
      # if: always() so a job killed at the 360-minute ceiling still hands over every bucket
      # that finished — the same reason the per-bucket summaries are written inside the loop.
      - name: Upload results (JUnit for clustering, classification JSON, full log)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ms-bucket-${{ inputs.label || inputs.bucket || 'list' }}-${{ steps.bc.outputs.version }}
          path: results
          if-no-files-found: ignore
