name: BC Tests

# The BC test matrix, defined once and called by both paths that need it:
# test-matrix.yml (push / pull request) and publish.yml (release).
#
# It lives in its own file because publish.yml used to carry a hand-maintained
# COPY of these steps, and that copy drifted from this one four separate times —
# each divergence found only when a release broke:
#
#   * missing -p:AllowBcArtifactDownload=true      -> build failed before any test ran
#   * missing the R2R platform-app download        -> 17 corpus tests failed on BC 27.3
#   * missing the generated .runsettings           -> 47 engine tests skipped, v2.3.0 failed
#   * missing the Cecil cache warm step            -> same 47 skipped, v2.3.1 failed
#
# The last two are the same defect found twice: the v2.3.0 fix copied two of the
# three steps that make the in-process engine tests run and left out the one that
# has to come first. A subset of a job is not a job. See issue #1976, and
# AlRunner.Tests/ReleaseTestParityTests.cs for the guard that keeps both callers
# delegating here instead of re-inlining.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref to check out. Empty (the default) means the caller's own ref,
          which is what the push / pull-request path wants. The release path
          passes the release tag, so the matrix tests exactly the commit being
          published rather than whatever main has moved on to.
        type: string
        required: false
        default: ''
    outputs:
      required-version:
        description: >-
          The live-resolved 28.1.* build this run actually tested (resolve-versions'
          `required-version`, see below). publish.yml's release job reads this instead
          of carrying its own static _BCVersion pin — see #2010: a hardcoded pin in the
          one path nobody exercises except during a release rotted the moment Microsoft
          withdrew the build it named, and the release failed AFTER the tag was already
          pushed. Handing the caller the exact version THIS run resolved and gated on
          means the release can never build against a version different from — or
          staler than — the one that just passed the matrix.
        value: ${{ jobs.resolve-versions.outputs.required-version }}
      versions-json:
        description: >-
          JSON array of every live-resolved full BC build this run tested — one per
          .github/bc-versions.txt entry (the same list `matrix` carries, flattened to
          just the version strings). Used to build the per-BC-minor engine variants
          (#2024 item 3 / #2027) WITHOUT either caller re-resolving versions itself —
          re-resolving in a caller is exactly the re-inlining ReleaseTestParityTests
          guards against (#1976), and would risk building a variant against a DIFFERENT
          build than the one the matrix above just gated on if Microsoft published a new
          build in between.
        value: ${{ jobs.resolve-versions.outputs.versions-json }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      # The PRIMARY version (28.1) — the one the runner is developed against, used by
      # jobs that build once rather than across the matrix (currently `smoke`). Every
      # version in the matrix now gates; this output just picks the representative one.
      required-version: ${{ steps.resolve.outputs.required-version }}
      versions-json: ${{ steps.resolve.outputs.versions-json }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Resolve BC versions
        id: resolve
        run: |
          # Each prefix in bc-versions.txt → one matrix entry {bc-version, required}.
          #
          # EVERY version gates. Older versions used to be informational
          # (continue-on-error) "until verified" — and they had failed on every single
          # run since the matrix landed without anyone being told, because a red
          # informational leg still reports the check as green. They are now verified:
          # BC 27.0 runs the corpus 1904/1904, the unit tests 198/198 and runner-extras
          # in full. Every blocker turned out to be our own test scaffolding (a
          # dependency pinned above what BC ships, suite errors that never reached the
          # exit code, one unreadable .app poisoning its siblings, and application-version
          # floors) — not a runner capability gap.
          #
          # So the informational tier has nothing left to protect, and keeping it would
          # mean a BC 27 regression lands silently, which is exactly what this matrix
          # exists to prevent. 28.1 stays singled out only as `required-version`, for
          # single-build jobs that need to name one version.
          BC_PREFIXES=$(cat .github/bc-versions.txt | grep -v '^#' | tr '\n' ' ')
          ENTRIES="[]"
          for prefix in $BC_PREFIXES; do
            FULL=$(dotnet run --project tools/DownloadArtifacts -- resolve-version "$prefix" dummy 2>/dev/null || true)
            if [ -n "$FULL" ]; then
              REQ=True
              [ "$prefix" = "28.1" ] && echo "required-version=$FULL" >> "$GITHUB_OUTPUT"
              echo "  $prefix -> $FULL (required=$REQ)"
              ENTRIES=$(echo "$ENTRIES" | python3 -c "import json,sys; v=json.load(sys.stdin); v.append({'bc-version':'$FULL','required':$REQ}); print(json.dumps(v))")
            else
              echo "  $prefix -> FAILED (skipping)"
            fi
          done
          echo "matrix={\"target\":$ENTRIES}" >> "$GITHUB_OUTPUT"
          echo "Matrix: $ENTRIES"

          VERSIONS_JSON=$(echo "$ENTRIES" | python3 -c "import json,sys; v=json.load(sys.stdin); print(json.dumps([e['bc-version'] for e in v]))")
          echo "versions-json=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "Versions: $VERSIONS_JSON"

  test:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    name: BC ${{ matrix.target.bc-version }}${{ matrix.target.required && ' (required)' || '' }}
    # Every leg gates — see the resolve step for why the informational tier was removed.
    # The flag is kept (rather than hardcoding `false`) so a genuinely unverified version
    # can be added to bc-versions.txt as informational without reworking the job.
    continue-on-error: ${{ !matrix.target.required }}
    env:
      BC_VERSION: ${{ matrix.target.bc-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      # BC 28.1 is a .NET 8 product (Server.runtimeconfig.json tfm=net8.0); the runner
      # targets net8.0 and runs it on its real runtime. (BC's Types.dll binds
      # System.Text.Json 10, which the runner deploys app-local via deps.json — see
      # AlRunner.csproj.) net8 SDK builds the runner and tools/DownloadArtifacts.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build (auto-downloads BC ${{ matrix.target.bc-version }} DLLs)
        run: |
          # AllowBcArtifactDownload=true is what actually permits the in-build fetch
          # (AlRunner.csproj target EnsureBCServiceTierDlls). Without it the sibling
          # FailIfBCServiceTierDllsMissing target hard-errors, and this step failed
          # before a single test ran — despite its name promising the download.
          dotnet build AlRunner.slnx \
            -p:_BCVersion=${{ matrix.target.bc-version }} \
            -p:AllowBcArtifactDownload=true \
            -c Release

      - name: Download R2R platform apps (Base/System Application, …)
        run: |
          # The corpus ships a SYMBOL-ONLY Base Application in its .alpackages, which is
          # enough to COMPILE but carries no runtime DLL — so cross-app tableextension tests
          # that instantiate a Base App record (e.g. Item Journal Batch / Record233) fail at
          # runtime ("no loaded type Record233"). Fetch the R2R platform apps (with DLLs) at
          # this BC version into a package cache so DependencyLoader can load the real types.
          # They're a higher version than the .alpackages symbols, so the resolver prefers them.
          dotnet run --project tools/DownloadArtifacts -- \
            platform-apps ${{ matrix.target.bc-version }} "$HOME/.al-runner/platform-apps"

      - name: Download the Microsoft test toolkit (Any, Library Assert, Test Runner, …)
        run: |
          # tests/runner-extras/microsoft-dependencies depends on Application Test Library
          # (w1/Extensions, fetched above), which in turn needs the toolkit apps that ship
          # in the PLATFORM artifact — two different artifacts, two commands. Without these
          # the leg aborted on a provisioning gap before running a test; it only passed
          # locally because a full multi-GB BC sandbox artifact happened to be cached.
          #
          # Deliberately a SEPARATE directory, not merged into platform-apps: the toolkit is
          # 107 apps, and CacheKeyDependencyClosureTests builds a "different closure" by
          # dropping the ordinally-first .app from that directory. Merged, that drops an
          # unrelated toolkit app the fixture never resolves, both closures come out
          # identical, and the test fails for a reason that has nothing to do with the
          # cache key. --package-cache is repeatable; pass both.
          dotnet run --project tools/DownloadArtifacts -- \
            test-apps ${{ matrix.target.bc-version }} "$HOME/.al-runner/test-apps"

      - name: Warm the Ncl Cecil rewrite cache
        run: |
          # The in-process engine tests (BcEngineCollection) can only load a rewritten
          # Ncl.dll that came from a cache HIT — a process that performs the rewrite and
          # then loads the result dies with BadImageFormatException 0x80131124, which is
          # why Program.cs re-execs after a cold rewrite. A test host cannot re-exec, so
          # it skips instead. One throwaway runner invocation populates
          # ~/.cache/al-runner/ncl-cecil so those tests actually execute below rather
          # than silently skipping on every fresh CI runner.
          # Must be a REAL run: --version/--help return long before the Cecil bootstrap.
          # The RecordTriggerXRec fixture is the smallest bundle in the repo.
          ./AlRunner/bin/Release/net8.0/al-runner --quiet AlRunner.Tests/Fixtures/RecordTriggerXRec || true
          ls -la ~/.cache/al-runner/ncl-cecil/ || echo "WARNING: Cecil cache still cold"

          # AlRunner.Tests ships its OWN bin-deployed copy of Microsoft.Dynamics.Nav.Ncl.dll (it
          # references Nav.Ncl directly — see AlRunner.Tests.csproj — and, unlike AlRunner
          # itself, is NOT stripped of it: see Directory.Build.targets' project-scoped Ncl
          # exclusion), and that copy starts out PRISTINE (un-rewritten) after every build.
          # Left alone, BcEngineBootstrap (see AlRunner.Tests/BcEngineCollection.cs) would
          # rewrite it in-process on the very first `dotnet test` invocation below, then skip
          # rather than load a file it just replaced (BadImageFormatException 0x80131124
          # hazard) — on every fresh CI runner, every time, covering nothing. Pre-copy an
          # ALREADY-rewritten copy so the bootstrap below sees a no-op instead of a cold
          # rewrite.
          #
          # Source: ~/.cache/al-runner/ncl-cecil, NOT AlRunner's own bin dir — AlRunner no
          # longer ships (or even builds with) a bin-deployed Ncl.dll at all (see
          # NclShadowRuntime.cs; the throwaway run above wrote its rewritten copy into a
          # runner-owned SHADOW dir instead, keeping ncl-cecil warm same as before). The
          # rewritten BYTES are identical regardless of which project triggered the rewrite
          # (RewriteNcl is a deterministic transform of the same service-tier Ncl.dll; the
          # cache key folds in the runner assembly's content hash only for INVALIDATION, not
          # because the output differs per caller) — that's what makes this pre-copy work at
          # all: BcEngineBootstrap's own before/after SHA-256 CONTENT hash comparison of the
          # bin copy (see the `FileHash` calls around `RewriteInPlace` in
          # BcEngineCollection.cs) reports `changed == false` once the bin copy is already
          # byte-identical to what an in-process rewrite would produce, regardless of either
          # file's timestamp or origin, so the bootstrap treats it as already-rewritten and
          # does not skip.
          cp "$(ls -t ~/.cache/al-runner/ncl-cecil/*.dll | head -1)" AlRunner.Tests/bin/Release/net8.0/Microsoft.Dynamics.Nav.Ncl.dll

      - name: Generate .runsettings for in-process BC engine tests
        run: |
          # See AlRunner.Tests/EngineStartupHook.cs and
          # AlRunner/EngineTestBinResolverStartupHook.cs for the full mechanism (issue #1813):
          # VSTest's own DiaSession loads Microsoft.Dynamics.Nav.Ncl (for stack-trace source
          # mapping) before any test code — including our [ModuleInitializer] — gets a chance to
          # run, which made the Cecil rewrite a no-op and BcEngineBootstrap.Ready false on every
          # CI run. DOTNET_STARTUP_HOOKS is the earliest hookable point in a .NET process — it
          # runs strictly before the host's own Main(), so entering our hook assemblies forces
          # AlRunner.Tests.dll's module (and its [ModuleInitializer]) to run first instead.
          #
          # Scoped via RunConfiguration.EnvironmentVariables to the isolated testhost CHILD
          # process VSTest spawns, deliberately NOT an ambient env var on this step: an ambient
          # var also runs the bootstrap inside the outer `dotnet test` CLI driver process, where
          # AppContext.BaseDirectory resolves to the .NET SDK's own install directory instead of
          # AlRunner.Tests' bin dir (measured: without this, that combination rewrote
          # Microsoft.Dynamics.Nav.Ncl.dll INTO the SDK's own folder).
          cat > engine.runsettings <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <EnvironmentVariables>
                <DOTNET_STARTUP_HOOKS>$(pwd)/AlRunner.Tests/bin/Release/net8.0/al-runner.dll:$(pwd)/AlRunner.Tests/bin/Release/net8.0/AlRunner.Tests.dll</DOTNET_STARTUP_HOOKS>
              </EnvironmentVariables>
            </RunConfiguration>
          </RunSettings>
          EOF

      # Issue #1825: AL_RUNNER_PHASE_LOG makes each runner subprocess append one JSONL
      # record per app group / bundle / process to a shared file. The 76 spawns' stdout
      # is captured into strings and discarded by the tests (and several assert on it
      # verbatim), so this is the only way to see where their minutes go. Opt-in and
      # completely inert without the variable. The start marker is a separate step so
      # the run block below stays byte-identical and rebases cleanly.
      - name: Phase-log start marker (unit tests)
        run: date +%s > phase-step-start-unit

      - name: Run unit tests (AlRunner.Tests)
        env:
          AL_RUNNER_PHASE_LOG: ${{ github.workspace }}/phase-log-unit.jsonl
          # Issue #2070: opt-in ARM/EVAL/FIRE/WAIT (server, AlDapSession.cs) + SEND/GIVEUP
          # (client, DapClient.cs) trace, both stamped with the SAME wall-clock UTC so the
          # two one-sided traces become one comparable timeline. Ambient like
          # AL_RUNNER_PHASE_LOG above (not RunConfiguration-scoped like DOTNET_STARTUP_HOOKS
          # further up) because it needs to reach the SPAWNED al-runner --dap child process
          # DapClient starts via Process.Start, which inherits ambient env vars, not
          # .runsettings-scoped ones. Zero behavior change when unset; here specifically so
          # the NEXT DapServerTests step-timeout failure carries the trace instead of another
          # "[dap] client connected." dead end.
          AL_DAP_STEP_TRACE: "1"
        run: |
          # --settings wires the DOTNET_STARTUP_HOOKS chain generated above so the in-process BC
          # engine tests (BcEngineCollection) execute here, in this single pass, instead of
          # skipping — see the "Generate .runsettings" step. There used to be a second, separate
          # `dotnet test --filter` re-run after this step to catch those tests on a "second
          # pass"; it is gone because there is no longer a first-pass skip for it to work around
          # (see AlRunner.Tests/BcEngineReadinessGuardTests.cs for the CI-fails-loud regression
          # guard that replaces it).
          #
          # --logger trx (issue #1829): VSTest records startTime/endTime per test, which is
          # the only per-TEST occupancy signal there is. The phase log sees the spawned
          # runner processes, and their summed wall clock over the step wall clock reads
          # 1.83x — a figure that structurally understates occupancy, because much of each
          # test's time is host-side work outside the subprocess. Real thread occupancy was
          # 3.00x, and the whole shortfall was a single-threaded tail. See the report step.
          dotnet test AlRunner.Tests/AlRunner.Tests.csproj -c Release --no-build --settings engine.runsettings \
              --logger "trx;LogFileName=unit-tests.trx" --results-directory "$PWD/trx"

      - name: TRX occupancy report (unit tests)
        # always(): the timeline is most worth seeing on a red leg, and this must never be
        # the thing that fails one.
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/trx-occupancy.py trx/unit-tests.trx \
              --label "AlRunner.Tests — BC ${{ matrix.target.bc-version }}" \
              --threads 4

      # Issue #1887: the occupancy report above is diagnostic-only (never fails the leg),
      # which is exactly how a stale CollectionCostOrderer.MeasuredWeightSeconds table went
      # unnoticed for two whole classes until someone happened to read it by hand. This step
      # is deliberately NOT continue-on-error and only runs when the unit-test step actually
      # produced a trx — a collection dispatched at UnmeasuredWeightSeconds because it is
      # genuinely missing from the table is loud CI failure, per
      # .claude/rules/loud-failures.md, not another quiet report.
      - name: Collection weight table freshness (unit tests)
        run: |
          python3 scripts/check-collection-weights.py trx/unit-tests.trx

      - name: Phase-log report (unit tests)
        # always(): a red unit-test step is exactly when the timings are most worth
        # seeing, and this must never be the thing that fails the leg.
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/phase-log-report.py phase-log-unit.jsonl \
              --label "AlRunner.Tests — BC ${{ matrix.target.bc-version }} (4-way parallel, CONTENDED)" \
              --step-seconds $(( $(date +%s) - $(cat phase-step-start-unit 2>/dev/null || date +%s) ))

      - name: Run al-language corpus
        id: al-language
        env:
          AL_RUNNER_PHASE_LOG: ${{ github.workspace }}/phase-log-corpus.jsonl
        run: |
          # The canonical corpus lives in the tests/al-language submodule.
          # See docs/expectations.md for how OOS-by-design tests are declared.
          #
          # --strict makes the runner exit non-zero when ANY test fails (1), a bucket
          # fails to execute (2), or a bucket fails to compile (3). The pipeline must
          # NOT report green while corpus tests fail — known runtime gaps included.
          # So this leg stays red until every corpus test passes (or its failure is
          # declared OOS-by-design in tests/expectations/, which reclassifies it to a
          # pass). Crash codes (134/139) also surface here as a non-zero exit → red.
          #
          # --count-baseline (#1880) is the companion guard: --strict only fails on a
          # test FAILING, so a bundle/app-group that silently stops being discovered
          # (dependency rename, duplicate app-id collision — #1850, dropped app group —
          # #1861) still exits 0 as long as every SURVIVING test passes. It is an EXACT
          # match, not a floor: a DROP below the recorded baseline exits 4, and so does
          # GROWTH above it — the count must be bumped in
          # tests/expectations/count-baseline/ in the same PR that changed it, or this
          # leg goes red with the exact expected/actual numbers to use.
          rc=0
          start=$SECONDS
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
              tests/al-language/tests/al-language \
              --package-cache "$HOME/.al-runner/platform-apps" \
              --package-cache "$HOME/.al-runner/test-apps" \
              --strict \
              --count-baseline tests/expectations/count-baseline/test-count-baseline.json \
              --out al-language-results.json || rc=$?
          elapsed=$(( SECONDS - start ))
          echo "elapsed=${elapsed}s" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::al-language run failed (exit $rc: 1=test failure, 2=exec fail, 3=compile fail, 4=count-baseline mismatch, 134/139=crash)"
            exit "$rc"
          fi

      - name: Run al-language xmlport tests in isolation (order-independence guard)
        # always() so this still runs when the full-corpus leg above is red — it answers a
        # DIFFERENT question and its answer is most useful exactly when something is broken.
        #
        # The full corpus passing does not prove each test passes on its own: skeleton state
        # seeded as a side effect of one subsystem can silently carry another. That is not
        # hypothetical — session.systemTenant was seeded only while constructing a report, so
        # these 14 xmlport tests passed whenever a report test happened to run first and failed
        # when none did, landing on a different BC leg each CI run. Running a slice that
        # deliberately excludes the report tests keeps that class of bug from coming back
        # disguised as flakiness.
        if: ${{ always() }}
        run: |
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
              tests/al-language/tests/al-language \
              --package-cache "$HOME/.al-runner/platform-apps" \
              --test "Codeunit6020" \
              --strict

      - name: Phase-log report (al-language corpus)
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/phase-log-report.py phase-log-corpus.jsonl \
              --label "al-language corpus — BC ${{ matrix.target.bc-version }} (single process)"

      - name: Run runner-extras (if present)
        # always() so a failed (red) corpus leg above doesn't skip this — runner-extras
        # is an independent gate. --strict so any runner-extra failure also fails the leg.
        if: ${{ always() && hashFiles('tests/runner-extras/**/*.al') != '' }}
        env:
          AL_RUNNER_PHASE_LOG: ${{ github.workspace }}/phase-log-runner-extras.jsonl
        run: |
          # Same package cache the corpus leg gets. Without it this leg saw
          # "package caches: 0 dir(s)" and aborted on the first suite declaring a
          # Microsoft dependency (microsoft-dependencies -> Application Test Library)
          # before running a single test.
          #
          # --count-baseline (#1880), same rationale as the al-language corpus leg
          # above. runner-extras genuinely has fewer tests on BC 27.0/27.3/27.5 than
          # 28.x (some AL surfaces are gated on preprocessor symbols only defined from
          # 28.0 on) — tests/expectations/count-baseline/test-count-baseline.json
          # carries a per-BC-version expected count for exactly that reason, not a
          # single global value.
          dotnet run --no-build --project AlRunner -c Release --framework net8.0 -- \
              tests/runner-extras \
              --package-cache "$HOME/.al-runner/platform-apps" \
              --package-cache "$HOME/.al-runner/test-apps" \
              --strict \
              --count-baseline tests/expectations/count-baseline/test-count-baseline.json \
              --out runner-extras-results.json

      - name: Phase-log report (runner-extras)
        # The step with the most to say: 25 app groups in ONE process (down from 38 —
        # see #1847, which folded 16 standalone-with-no-hazard suites into
        # tests/runner-extras/standalone-suites/ and left the 2 install-trigger suites
        # plus the 22 structurally-dependent dep/main and Microsoft-dependency pairs
        # isolated), so engine boot is amortised away and the per-app-group tax is
        # visible on its own.
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/phase-log-report.py phase-log-runner-extras.jsonl \
              --label "runner-extras — BC ${{ matrix.target.bc-version }} (single process, 25 app groups)"

      - name: Server-mode integration (multi-bundle contract)
        # always() for the same reason as runner-extras: an independent gate.
        # Drives a real --server daemon over stdin/stdout NDJSON against the
        # server-multibundle fixture pair and asserts the app + test-app request
        # shape works warm: dep-table CRUD green, then a dep schema edit MISSes
        # the AL-output cache and fails loudly (exitCode 3, EMIT-EXCLUDED) —
        # never a stale-cache runtime failure or a silently-green shrunken run.
        if: ${{ always() && hashFiles('scripts/tests/server-mode-test.sh') != '' }}
        run: |
          scripts/tests/server-mode-test.sh \
              --package-cache "$HOME/.al-runner/platform-apps" \
              --package-cache "$HOME/.al-runner/test-apps"

      - name: Server-mode reload integration (issue #1860)
        # Regression coverage for #1860's claimed cross-request wiring bug:
        # a --server RELOAD that introduces a NEW tableextension on a table
        # already recorded wired by an earlier request in the SAME session.
        # Investigation found the claim does NOT reproduce on this codebase —
        # RunAllBundlesForServer calls BcRuntime.ResetForNewBundleReload()
        # unconditionally once per runTests request, which clears
        # _fieldTriggersWiredTables (and every other per-bundle cache) before
        # each request, so the claimed interleaving cannot occur. This step
        # pins that down as a permanent regression guard.
        if: ${{ always() && hashFiles('scripts/tests/server-reload-test.sh') != '' }}
        run: |
          scripts/tests/server-reload-test.sh \
              --package-cache "$HOME/.al-runner/platform-apps" \
              --package-cache "$HOME/.al-runner/test-apps"

      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.target.bc-version }}
          path: |
            al-language-results.json
            runner-extras-results.json
            phase-log-unit.jsonl
            phase-log-corpus.jsonl
            phase-log-runner-extras.jsonl
            trx/unit-tests.trx
          if-no-files-found: ignore

  smoke:
    name: Smoke ${{ matrix.tfm }}
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tfm: [net8.0]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      # BC 28.1 runs on .NET 8; the runner targets net8.0. net8 SDK builds + runs it.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Clear cold-cache Cecil rewrite cache
        # ncl-shadow alongside ncl-cecil: on a fresh ubuntu-latest runner neither has any
        # prior content anyway, but clearing both keeps this step's intent (simulate a
        # genuinely first-ever Cecil rewrite, not a cache HIT) unambiguous now that Ncl.dll
        # is resolved via NclShadowRuntime's shadow dir rather than an in-place bin rewrite.
        run: rm -rf ~/.cache/al-runner/ncl-cecil/ ~/.cache/al-runner/ncl-shadow/

      - name: Build Release
        # Pin to the resolved REQUIRED version rather than AlRunner.csproj's baked-in
        # _BCVersion default: resolve-versions picks whatever 28.1.* MS currently ships,
        # so the hardcoded default goes stale the moment MS publishes a new build and
        # this job then demanded an artifact dir nothing had provisioned.
        run: |
          dotnet build AlRunner.slnx \
            -p:_BCVersion=${{ needs.resolve-versions.outputs.required-version }} \
            -p:AllowBcArtifactDownload=true \
            -c Release

      - name: Run cold-cache binary smoke test
        run: |
          set +e
          # Point at the canonical corpus app (a real bundle with a proper app.json +
          # dependency closure), NOT the submodule ROOT — the root sweeps multiple apps
          # and fixtures into one malformed bundle with no Base Application reference, so
          # any cross-app tableextension there fails to resolve (AL0185/AL0247) and aborts
          # the whole emit. The crash-gate purpose (cold Cecil rewrite + emit + run) is
          # fully exercised by the canonical app. --strict tolerated codes are 0|1|2 below.
          #
          # --auto-provision: as of #1678 the platform-app R2R gate also scans the target
          # bundle's OWN .alpackages (not just the home-rooted default caches) — and the
          # corpus vendors symbol-only Base/System Application/Business Foundation there
          # (the standard "symbol download, no R2R" shape). On a genuinely cold cache with
          # no package-cache and no prior provisioning, the gate now correctly fails loud
          # BEFORE any emit/run, which is the fix's whole point (see #1678) but means this
          # job's crash-gate (cold Cecil rewrite + emit + run) would never even start.
          # --auto-provision downloads the corpus's platform apps once so the rest of the
          # smoke test still exercises what it always exercised.
          ./AlRunner/bin/Release/${{ matrix.tfm }}/al-runner --strict --quiet --auto-provision tests/al-language/tests/al-language > smoke.log 2>&1
          rc=$?
          cat smoke.log
          case "$rc" in
            0|1|2) ;;
            *)
              echo "::error::unexpected exit code $rc (expected 0, 1, or 2; crashes like 134/139 are failures)"
              exit 1
              ;;
          esac
          if ! grep -Eq '^  pass:[[:space:]]+[1-9][0-9]*$' smoke.log; then
            echo "::error::smoke output did not include a passing-test summary line"
            exit 1
          fi

  pack:
    name: Release pack (dry, no publish)
    needs: resolve-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install the aarch64 cross-compiler (#1672)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build each BC-minor engine variant (#2024 item 3 / #2027)
        # One thin al-runner.dll build per version in resolve-versions' versions-json
        # output (already the live-resolved, already-tested build for every
        # .github/bc-versions.txt entry — NOT re-resolved here: re-resolving would be
        # exactly the re-inlining ReleaseTestParityTests/#1976 exists to catch, since
        # publish.yml's release job runs this identical step and must not carry its own
        # copy of `tools/DownloadArtifacts` version resolution). Staged for the pack step
        # below to fold into variants/<full-build-version>/ in the nupkg (see
        # AlRunner.csproj's EngineVariantsStagingDir property). EngineVariants.cs picks
        # the matching one at startup instead of running a single fixed-minor engine
        # against whatever BC artifact happens to be selected — the root cause of #2020.
        # Deliberately rebuilds the SAME version the "Build and pack" step below also
        # builds for the top-level entry point (whichever prefix resolve-versions marks
        # `required-version`) — that duplication is intentional, not wasted: the
        # top-level slot and its own variants/<version>/ copy are independent package
        # locations by design (see AlRunner.csproj), and this loop is the single source
        # of truth for every variant regardless of which one also happens to be primary.
        env:
          VERSIONS_JSON: ${{ needs.resolve-versions.outputs.versions-json }}
        run: |
          mkdir -p ./variants-staging
          for full in $(echo "$VERSIONS_JSON" | python3 -c "import json,sys; [print(v) for v in json.load(sys.stdin)]"); do
            echo "Building engine variant for BC $full..."
            dotnet build AlRunner/ \
              -p:_BCVersion="$full" -p:AllowBcArtifactDownload=true \
              -o "./variant-build-$full"
            mkdir -p "./variants-staging/$full"
            # #2166: AlRunner.QueryJoin.dll and AlRunner.Provisioning.dll are load-by-path
            # assemblies (see NclShadowRuntime.MustCopyNames) that al-runner.dll resolves
            # from its own directory at runtime — they must ship in every variant dir the
            # same as the top-level "any" folder already ships them, not be left for the
            # shadow-dir mirror to symlink in from origDir (see NclShadowRuntime.cs's
            # #2166 comment for why relying on that symlink surviving is fragile).
            for f in al-runner.dll al-runner.pdb al-runner.deps.json al-runner.runtimeconfig.json \
                     AlRunner.QueryJoin.dll AlRunner.Provisioning.dll AlRunner.Provisioning.pdb; do
              cp "./variant-build-$full/$f" "./variants-staging/$full/$f"
            done
            # #2168: Win32Stubs/ is the directory-shaped equivalent of the same gap —
            # Win32Stubs.LocatePrebuiltSo resolves the prebuilt Linux Win32 P/Invoke shim
            # from AppContext.BaseDirectory/Win32Stubs/ at runtime, so it must ship in
            # every variant dir too (see NclShadowRuntime.MustCopyDirectoryNames).
            cp -r "./variant-build-$full/Win32Stubs" "./variants-staging/$full/Win32Stubs"
            rm -rf "./variant-build-$full"
          done
          echo "Staged variants:"
          ls -la ./variants-staging

      - name: Build and pack (mirrors publish.yml's release job, minus the push)
        # #2010: publish.yml's "Build and pack" step is the one step in the whole
        # release path that ONLY ever ran during an actual release — the release of
        # v2.4.0 passed all 8 matrix legs above and then failed here, because
        # AlRunner.csproj's static _BCVersion pin named a build Microsoft had since
        # withdrawn. The pin no longer exists (publish.yml now resolves it live from
        # this workflow's resolve-versions output), but the failure mode this job
        # guards against is broader than that one pin: ANYTHING in the build-and-pack
        # step — a bad Directory.Build.props override, a Win32Stubs cross-compile
        # regression, a nuspec/PackAsTool misconfiguration — used to be untestable
        # without dispatching a real release. Running the identical commands here,
        # on every push/PR, against the SAME live-resolved version the matrix above
        # just gated on, means a release-build regression fails a normal CI run
        # instead of a release.
        run: |
          dotnet build AlRunner/ \
            -p:_BCVersion=${{ needs.resolve-versions.outputs.required-version }} \
            -p:AllowBcArtifactDownload=true
          dotnet pack AlRunner/ \
            -p:_BCVersion=${{ needs.resolve-versions.outputs.required-version }} \
            -p:AllowBcArtifactDownload=true -p:Version=0.0.0-ci \
            -p:SuppressImplicitGitSourceLink=false -p:IncludeSourceRevisionInInformationalVersion=true \
            -p:EngineVariantsStagingDir="$(pwd)/variants-staging" \
            -o ./nupkg

      - name: Assert a package was actually produced
        run: |
          shopt -s nullglob
          pkgs=(./nupkg/*.nupkg)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::dotnet pack produced no .nupkg — the release path would ship nothing"
            exit 1
          fi
          echo "Packed: ${pkgs[*]}"

      - name: Assert the package doesn't ship BC/Aspose/Graph binaries
        # Guards against a regression of the mechanism fixed by issues #2022/#2025:
        # MSBuild's default assembly-reference resolution follows Ncl.dll's transitive
        # closure (Aspose.PDF/Words/Cells, Microsoft.Graph, the whole
        # Microsoft.BusinessCentral.* family, Ncl.dll itself, …) into the tool package
        # unless Directory.Build.targets' StripBcAppClosureFromCopyLocal target strips it
        # back out. No exceptions any more — see that target's comment and
        # NclShadowRuntime.cs's class doc for how Ncl.dll itself is now resolved from the
        # user's own BC artifact cache at runtime instead of being shipped.
        run: .github/scripts/check-nupkg-contents.sh ./nupkg/*.nupkg

      - name: Assert every BC-minor engine variant made it into the package
        # A staging-step failure that got silently skipped (e.g. a bad glob) would
        # otherwise still produce a valid-looking package with zero variants — the exact
        # "looks fine, quietly regressed" shape #1825/#2010's own history warns about.
        run: |
          count=$(unzip -l ./nupkg/*.nupkg | grep -c 'tools/net8.0/any/variants/.*/al-runner\.dll$')
          expected=$(grep -v '^#' .github/bc-versions.txt | tr ' ' '\n' | grep -c .)
          echo "Packed variants: $count, expected: $expected"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::nupkg contains $count engine variant(s), expected $expected (one per .github/bc-versions.txt entry)"
            exit 1
          fi

          # #2166: variant directories are ALSO the runtime shadow-dir mirror's origDir
          # substitute for the entry-assembly manifest set (see NclShadowRuntime), so
          # every load-by-path assembly al-runner.dll resolves from its own directory at
          # runtime must ship here too — not just the top-level "any" folder. This nupkg
          # inspection is deterministic (unlike an install-and-run check, which the
          # shadow-dir's fallback-to-origDir symlinking can mask — see the PR for #2166)
          # and is the check that would have caught the regression in CI before release.
          for f in AlRunner.QueryJoin.dll AlRunner.Provisioning.dll AlRunner.Provisioning.pdb; do
            vcount=$(unzip -l ./nupkg/*.nupkg | grep -c "tools/net8.0/any/variants/.*/$f\$")
            echo "Packed variant copies of $f: $vcount, expected: $expected"
            if [ "$vcount" -ne "$expected" ]; then
              echo "::error::nupkg contains $vcount variant copy/copies of $f, expected $expected (one per .github/bc-versions.txt entry) — #2166"
              exit 1
            fi
          done

          # #2168: Win32Stubs/ has the identical unpackaged-per-variant fragility, just
          # as a directory rather than a single file — Win32Stubs.LocatePrebuiltSo
          # resolves the prebuilt Linux Win32 P/Invoke shim from
          # AppContext.BaseDirectory/Win32Stubs/<rid-named .so> at runtime (lazily, the
          # first time AL test code reaches a Windows-only Win32 API through BC's
          # runtime), and the shadow-dir mirror's fallback-to-origDir directory symlink
          # masks a missing per-variant copy the same way it masked #2166 — so this is a
          # deterministic nupkg inspection, not an install-and-run check, same reasoning
          # as the loop above.
          for f in win32_stubs.c libwin32_stubs.linux-x64.so libwin32_stubs.linux-arm64.so; do
            vcount=$(unzip -l ./nupkg/*.nupkg | grep -c "tools/net8.0/any/variants/.*/Win32Stubs/$f\$")
            echo "Packed variant copies of Win32Stubs/$f: $vcount, expected: $expected"
            if [ "$vcount" -ne "$expected" ]; then
              echo "::error::nupkg contains $vcount variant copy/copies of Win32Stubs/$f, expected $expected (one per .github/bc-versions.txt entry) — #2168"
              exit 1
            fi
          done
